name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Android प्रोजेक्ट बनाओ और APK बिल्ड करो
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/java/com/apna/ai
          test -f index.html || { echo "index.html repo की जड़ में नहीं मिली"; exit 1; }
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'APNA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ApnaAI"
          include ':app'
          APNA_EOF
          cat > build.gradle <<'APNA_EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          APNA_EOF
          cat > gradle.properties <<'APNA_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          APNA_EOF
          cat > app/build.gradle <<'APNA_EOF'
          plugins { id 'com.android.application' }
          android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              namespace 'com.apna.ai'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.apna.ai'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          APNA_EOF
          cat > app/src/main/AndroidManifest.xml <<'APNA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent></queries>
              <application
                  android:label="Apna AI"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          APNA_EOF
          cat > app/src/main/res/values/styles.xml <<'APNA_EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:navigationBarColor">#0B1020</item>
              </style>
          </resources>
          APNA_EOF
          mkdir -p app/src/main/res/drawable-nodpi
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher.png
          cat > app/src/main/java/com/apna/ai/MainActivity.java <<'APNA_EOF'
          package com.apna.ai;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.database.Cursor;
          import android.provider.OpenableColumns;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.media.ExifInterface;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.List;
          import android.speech.tts.UtteranceProgressListener;
          import java.util.Locale;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.OutputStream;

          /** Apna AI: assets/index.html को सुरक्षित https origin (appassets.androidplatform.net) पर WebView में चलाता है। */
          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web = new WebView(this);
                  setContentView(web);
                  web.setBackgroundColor(0xFF0B1020);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // localStorage + IndexedDB
                  s.setAllowFileAccess(true);      // फ़ाइल-चुनने वाले (गैलरी/कैमरा) के नतीजे पढ़ने के लिए
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.addJavascriptInterface(new Bridge(), "ApnaAndroid");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          if ("https".equals(u.getScheme()) || "http".equals(u.getScheme())) {
                              startActivity(new Intent(Intent.ACTION_VIEW, u)); // बाहरी लिंक ब्राउज़र में
                          }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCb != null) { fileCb.onReceiveValue(null); fileCb = null; }
                          fileCb = cb;
                          if (params.isCaptureEnabled()) {
                              try {
                                  ContentValues cv = new ContentValues();
                                  cv.put(MediaStore.Images.Media.DISPLAY_NAME, "apna_" + System.currentTimeMillis() + ".jpg");
                                  cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                                  camUri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                                  Intent ci = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  ci.putExtra(MediaStore.EXTRA_OUTPUT, camUri);
                                  startActivityForResult(ci, 9);
                                  return true;
                              } catch (Exception e) { camUri = null; }
                          }
                          try {
                              startActivityForResult(params.createIntent(), 9);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (b == null) web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  else web.restoreState(b);
              }

              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String qText, qLang, qId;
              private float qRate = 1f;

              private void ttsJs(final String id, final String st) {
                  final String code = "window.__apnaTTS&&window.__apnaTTS(" + JSONObject.quote(id) + ",'" + st + "')";
                  runOnUiThread(() -> web.evaluateJavascript(code, null));
              }

              private void ttsRun(String text, String lang, float rate, String id) {
                  try {
                      String[] p = (lang == null || lang.isEmpty() ? "hi-IN" : lang).split("-");
                      int r = tts.setLanguage(p.length > 1 ? new Locale(p[0], p[1]) : new Locale(p[0]));
                      if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) { ttsJs(id, "nolang"); return; }
                      tts.setSpeechRate(rate <= 0 ? 1f : rate);
                      tts.speak(text, TextToSpeech.QUEUE_ADD, null, id);
                  } catch (Exception e) { ttsJs(id, "err"); }
              }

              private void doSpeak(String text, String lang, float rate, String id) {
                  if (tts == null) {
                      qText = text; qLang = lang; qRate = rate; qId = id;
                      tts = new TextToSpeech(this, status -> {
                          if (status != TextToSpeech.SUCCESS) { ttsReady = false; if (qId != null) ttsJs(qId, "err"); return; }
                          ttsReady = true;
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              public void onStart(String u) {}
                              public void onDone(String u) { ttsJs(u, "end"); }
                              public void onError(String u) { ttsJs(u, "err"); }
                          });
                          if (qId != null) { String i2 = qId; qId = null; ttsRun(qText, qLang, qRate, i2); }
                      });
                      return;
                  }
                  if (!ttsReady) { ttsJs(id, "err"); return; }
                  ttsRun(text, lang, rate, id);
              }

              private SpeechRecognizer sr;
              private String pendingLang;

              private ValueCallback<Uri[]> fileCb;
              private String pickKind = "file";
              private Uri camOut;

              private void pickJs(final String code) {
                  runOnUiThread(() -> web.evaluateJavascript("window.__apnaPick&&window.__apnaPick(" + code + ")", null));
              }

              private void startPick(String kind) {
                  pickKind = kind;
                  try {
                      if (kind.equals("cam")) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Images.Media.DISPLAY_NAME, "apna_" + System.currentTimeMillis() + ".jpg");
                          cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                          camOut = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                          Intent ci = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          ci.putExtra(MediaStore.EXTRA_OUTPUT, camOut);
                          startActivityForResult(ci, 12);
                      } else {
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(kind.equals("img") ? "image/*" : "*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          startActivityForResult(i, 11);
                      }
                  } catch (Exception e) {
                      pickJs("{t:'done'}");
                  }
              }

              private String uriName(Uri u) {
                  String n = null;
                  try (Cursor cr = getContentResolver().query(u, null, null, null, null)) {
                      if (cr != null && cr.moveToFirst()) {
                          int ix = cr.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (ix >= 0) n = cr.getString(ix);
                      }
                  } catch (Exception e) {}
                  if (n == null || n.isEmpty()) n = "file_" + System.currentTimeMillis();
                  return n;
              }

              private byte[] shrink(Uri u, String[] outMime) throws Exception {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(u)) { BitmapFactory.decodeStream(in, null, o); }
                  int mx = Math.max(o.outWidth, o.outHeight), s = 1;
                  while (mx / s > 2400) s *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = s;
                  Bitmap bm;
                  try (InputStream in = getContentResolver().openInputStream(u)) { bm = BitmapFactory.decodeStream(in, null, o2); }
                  if (bm == null) throw new Exception("decode");
                  int rot = 0;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      int ori = new ExifInterface(in).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1);
                      rot = ori == 6 ? 90 : ori == 3 ? 180 : ori == 8 ? 270 : 0;
                  } catch (Exception e) {}
                  if (rot != 0) {
                      Matrix m = new Matrix();
                      m.postRotate(rot);
                      bm = Bitmap.createBitmap(bm, 0, 0, bm.getWidth(), bm.getHeight(), m, true);
                  }
                  int big = Math.max(bm.getWidth(), bm.getHeight());
                  if (big > 1600) {
                      float k = 1600f / big;
                      bm = Bitmap.createScaledBitmap(bm, Math.round(bm.getWidth() * k), Math.round(bm.getHeight() * k), true);
                  }
                  boolean png = "image/png".equals(outMime[0]);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  bm.compress(png ? Bitmap.CompressFormat.PNG : Bitmap.CompressFormat.JPEG, 88, bo);
                  outMime[0] = png ? "image/png" : "image/jpeg";
                  return bo.toByteArray();
              }

              private void sendUris(final List<Uri> us) {
                  new Thread(() -> {
                      int idx = 0;
                      for (Uri u : us) {
                          try {
                              String name = uriName(u);
                              String[] mm = { getContentResolver().getType(u) };
                              byte[] bytes;
                              if (mm[0] != null && mm[0].startsWith("image/")) {
                                  bytes = shrink(u, mm);
                                  String ext = mm[0].equals("image/png") ? ".png" : ".jpg";
                                  int dot = name.lastIndexOf('.');
                                  name = (dot > 0 ? name.substring(0, dot) : name) + ext;
                              } else {
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  try (InputStream in = getContentResolver().openInputStream(u)) {
                                      byte[] buf = new byte[65536];
                                      int r, tot = 0;
                                      while ((r = in.read(buf)) > 0) {
                                          tot += r;
                                          if (tot > 15 * 1024 * 1024) throw new Exception("big");
                                          bo.write(buf, 0, r);
                                      }
                                  }
                                  bytes = bo.toByteArray();
                                  if (mm[0] == null) mm[0] = "application/octet-stream";
                              }
                              String b64 = Base64.encodeToString(bytes, Base64.NO_WRAP);
                              int CH = 400000, total = (b64.length() + CH - 1) / CH;
                              String id = "p" + System.currentTimeMillis() + "_" + (idx++);
                              for (int k = 0; k < total; k++) {
                                  String part = b64.substring(k * CH, Math.min(b64.length(), (k + 1) * CH));
                                  pickJs("{t:'c',id:" + JSONObject.quote(id) + ",i:" + k + ",n:" + total + ",name:" + JSONObject.quote(name) + ",mime:" + JSONObject.quote(mm[0]) + ",d:" + JSONObject.quote(part) + "}");
                              }
                          } catch (Exception e) {
                              pickJs("{t:'err'}");
                          }
                      }
                      pickJs("{t:'done'}");
                  }).start();
              }

              private Uri camUri;

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 11) {
                      if (res == RESULT_OK && data != null) {
                          java.util.ArrayList<Uri> us = new java.util.ArrayList<>();
                          if (data.getClipData() != null) {
                              for (int i = 0; i < data.getClipData().getItemCount(); i++) us.add(data.getClipData().getItemAt(i).getUri());
                          } else if (data.getData() != null) us.add(data.getData());
                          sendUris(us);
                      } else pickJs("{t:'done'}");
                      return;
                  }
                  if (req == 12) {
                      if (res == RESULT_OK && camOut != null) {
                          java.util.ArrayList<Uri> us = new java.util.ArrayList<>();
                          us.add(camOut);
                          sendUris(us);
                      } else {
                          if (camOut != null) { try { getContentResolver().delete(camOut, null, null); } catch (Exception e) {} }
                          pickJs("{t:'done'}");
                      }
                      camOut = null;
                      return;
                  }
                  if (req == 9) {
                      if (fileCb != null) {
                          Uri[] r = null;
                          if (camUri != null) {
                              if (res == RESULT_OK) r = new Uri[]{camUri};
                              else { try { getContentResolver().delete(camUri, null, null); } catch (Exception e) {} }
                              camUri = null;
                          } else {
                              try { r = WebChromeClient.FileChooserParams.parseResult(res, data); } catch (Exception e) {}
                          }
                          fileCb.onReceiveValue(r);
                          fileCb = null;
                      }
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              private void js(String kind, String text, int fin) {
                  final String code = "window.__apnaSR&&window.__apnaSR('" + kind + "'," + JSONObject.quote(text == null ? "" : text) + "," + fin + ")";
                  runOnUiThread(() -> web.evaluateJavascript(code, null));
              }

              private void doListen(String lang) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { js("x", "unsupported", 0); js("e", "", 0); return; }
                  if (sr != null) { try { sr.destroy(); } catch (Exception e) {} }
                  sr = SpeechRecognizer.createSpeechRecognizer(this);
                  sr.setRecognitionListener(new RecognitionListener() {
                      public void onReadyForSpeech(Bundle p) {}
                      public void onBeginningOfSpeech() {}
                      public void onRmsChanged(float v) {}
                      public void onBufferReceived(byte[] b) {}
                      public void onEndOfSpeech() {}
                      public void onEvent(int t, Bundle b) {}
                      private String first(Bundle b) {
                          ArrayList<String> l = b == null ? null : b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          return (l == null || l.isEmpty()) ? "" : l.get(0);
                      }
                      public void onPartialResults(Bundle b) { String t = first(b); if (!t.isEmpty()) js("r", t, 0); }
                      public void onResults(Bundle b) { String t = first(b); if (!t.isEmpty()) js("r", t, 1); js("e", "", 0); }
                      public void onError(int code) {
                          String k = (code == SpeechRecognizer.ERROR_NO_MATCH || code == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) ? "no-speech"
                                  : code == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS ? "not-allowed"
                                  : code == SpeechRecognizer.ERROR_CLIENT ? "aborted"
                                  : code == SpeechRecognizer.ERROR_RECOGNIZER_BUSY ? "busy"
                                  : (code == SpeechRecognizer.ERROR_NETWORK || code == SpeechRecognizer.ERROR_NETWORK_TIMEOUT || code == SpeechRecognizer.ERROR_SERVER) ? "network"
                                  : code == SpeechRecognizer.ERROR_AUDIO ? "audio" : "error" + code;
                          js("x", k, 0); js("e", "", 0);
                      }
                  });
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang == null || lang.isEmpty() ? "hi-IN" : lang);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  sr.startListening(i);
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(req, perms, res);
                  if (req != 7) return;
                  if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) doListen(pendingLang);
                  else { js("x", "not-allowed", 0); js("e", "", 0); }
              }

              @Override
              protected void onDestroy() {
                  if (sr != null) { try { sr.destroy(); } catch (Exception e) {} }
                  if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception e) {} }
                  super.onDestroy();
              }

              /** वेब-ऐप से बुलाया जाता है: फ़ाइल को Downloads में सेव करता है। */
              private class Bridge {
                  @JavascriptInterface
                  public void startListen(final String lang) {
                      runOnUiThread(() -> {
                          pendingLang = lang;
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) doListen(lang);
                          else requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 7);
                      });
                  }

                  @JavascriptInterface
                  public void speak(final String text, final String lang, final float rate, final String id) {
                      runOnUiThread(() -> doSpeak(text, lang, rate, id));
                  }

                  @JavascriptInterface
                  public void stopSpeak() {
                      runOnUiThread(() -> { if (tts != null && ttsReady) { try { tts.stop(); } catch (Exception e) {} } });
                  }

                  @JavascriptInterface
                  public void pick(final String kind) {
                      runOnUiThread(() -> startPick(kind));
                  }

                  @JavascriptInterface
                  public void stopListen() {
                      runOnUiThread(() -> { if (sr != null) { try { sr.stopListening(); } catch (Exception e) {} } });
                  }

                  @JavascriptInterface
                  public boolean saveFile(String name, String mime, String base64) {
                      try {
                          String safe = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) return false;
                          try (OutputStream o = getContentResolver().openOutputStream(uri)) {
                              if (o == null) return false;
                              o.write(Base64.decode(base64, Base64.DEFAULT));
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  // पहले वेब-ऐप को मौका दो (शीट बंद / पिछली स्क्रीन); उसने नहीं संभाला तो ऐप बंद
                  web.evaluateJavascript("(function(){try{return window.__appBack&&window.__appBack()===true}catch(e){return false}})()",
                          value -> { if (!"true".equals(value)) finish(); });
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }
          }
          APNA_EOF
          echo '' | base64 -d > app/debug.keystore
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ApnaAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
