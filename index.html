<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1020"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230B1020%27/%3E%3Cpath d=%27M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z%27 fill=%27%23FFB547%27/%3E%3C/svg%3E">
<title>Apna AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0B1020;--card:#141B30;--line:#232C47;--chip:#1C2542;--chip2:#2B3558;
  --accent:#FFB547;--onacc:#1A1200;--acct:#FFB547;--accsoft:rgba(255,181,71,.16);
  --text:#EEF1FA;--text2:#DDE3F5;--sub:#8E98B8;--sub2:#AEB8D8;--dim:#7C86A8;--dim2:#5B6688;
  --red:#FF8585;--redbg:#3A1B24;--mint:#5EE0C8;--mintbg:rgba(94,224,200,.14);--ok:#5EE0C8;--okbg:rgba(94,224,200,.12);
  --shadow:0 10px 30px rgba(0,0,0,.45);--scrim:rgba(4,7,16,.62);--voice1:#1A2347;--codebg:#0A0F1E;
  --chatbg:transparent;--chatimg:none;--fs:1;
  --gx:max(16px,env(safe-area-inset-left,0px));--gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@supports (color:color-mix(in srgb,red,blue)){:root{--accsoft:color-mix(in srgb,var(--accent) 16%,transparent)}}
:root[data-app="light"]{--bg:#F5F6FB;--card:#FFFFFF;--line:#E2E6F1;--chip:#EDF0F8;--chip2:#D9DFEF;--text:#141A33;--text2:#2B3357;--sub:#5C6788;--sub2:#47517A;--dim:#7A84A5;--dim2:#9AA3C0;--red:#C62F2F;--redbg:#FDE7E9;--mint:#0F9C82;--mintbg:rgba(15,156,130,.12);--ok:#0F8F6F;--okbg:rgba(15,156,130,.1);--acct:color-mix(in srgb,var(--accent) 55%,#000);--accsoft:color-mix(in srgb,var(--accent) 20%,transparent);--shadow:0 10px 30px rgba(20,26,51,.15);--scrim:rgba(20,26,51,.4);--voice1:#FFE9C4;color-scheme:light;}
@media (prefers-color-scheme:light){:root[data-app="system"]:not([data-theme="dark"]){--bg:#F5F6FB;--card:#FFFFFF;--line:#E2E6F1;--chip:#EDF0F8;--chip2:#D9DFEF;--text:#141A33;--text2:#2B3357;--sub:#5C6788;--sub2:#47517A;--dim:#7A84A5;--dim2:#9AA3C0;--red:#C62F2F;--redbg:#FDE7E9;--mint:#0F9C82;--mintbg:rgba(15,156,130,.12);--ok:#0F8F6F;--okbg:rgba(15,156,130,.1);--acct:color-mix(in srgb,var(--accent) 55%,#000);--accsoft:color-mix(in srgb,var(--accent) 20%,transparent);--shadow:0 10px 30px rgba(20,26,51,.15);--scrim:rgba(20,26,51,.4);--voice1:#FFE9C4;color-scheme:light;}}
:root[data-app="system"][data-theme="light"]{--bg:#F5F6FB;--card:#FFFFFF;--line:#E2E6F1;--chip:#EDF0F8;--chip2:#D9DFEF;--text:#141A33;--text2:#2B3357;--sub:#5C6788;--sub2:#47517A;--dim:#7A84A5;--dim2:#9AA3C0;--red:#C62F2F;--redbg:#FDE7E9;--mint:#0F9C82;--mintbg:rgba(15,156,130,.12);--ok:#0F8F6F;--okbg:rgba(15,156,130,.1);--acct:color-mix(in srgb,var(--accent) 55%,#000);--accsoft:color-mix(in srgb,var(--accent) 20%,transparent);--shadow:0 10px 30px rgba(20,26,51,.15);--scrim:rgba(20,26,51,.4);--voice1:#FFE9C4;color-scheme:light;}
html{font-size:calc(16px*var(--fs,1));height:100%}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',Hind,'Noto Sans Devanagari',system-ui,sans-serif;font-size:1rem;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
button,[data-act],[data-go]{touch-action:manipulation}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hc{--line:#5B6688;--sub:#C5CCE6;--dim:#B3BBD8}
.hc:root[data-app="light"]{--line:#7C86A8;--sub:#2B3357}

#app{position:relative;height:100%;overflow:hidden;background:var(--bg)}
#screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s;will-change:transform;overflow:hidden}
.screen.from-right{transform:translateX(100%)}
.screen.from-left{transform:translateX(-100%)}
.screen.from-bottom{transform:translateY(100%)}
.screen.from-none{transform:none}
.screen.in{transform:none}
.screen.out{opacity:0}
.screen.out.from-right{transform:translateX(100%)}
.screen.out.from-left{transform:translateX(-100%)}
.screen.out.from-bottom{transform:translateY(100%)}
.screen.under{pointer-events:none}
.reduce *,.reduce *::before,.reduce *::after{transition:none!important;animation:none!important}

/* header */
.hd{display:flex;align-items:center;gap:6px;padding:10px var(--gxr) 6px var(--gx);min-height:60px;flex:none}
.hd h1{margin:0;font-size:1.3rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-r{display:flex;gap:4px;align-items:center}
.bk{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:none;border:0;color:var(--text);cursor:pointer;margin-left:-8px;flex:none}
.bk:active,.ib:active,.xb:active{background:var(--chip)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:8px var(--gxr) 28px var(--gx);display:flex;flex-direction:column;gap:12px}
.pad0{padding:0}.padi{padding:14px 16px}.pb{padding-bottom:4px}
.sp{flex:1}.sp12{height:12px}.grow{flex:1;min-width:0}
.intro{color:var(--sub2);margin:0;line-height:1.55}
.note{color:var(--sub);font-size:.92rem;line-height:1.55;margin:0}
.note.warn{color:var(--red)}
.sub{color:var(--sub);font-size:.85rem}
.err{color:var(--red)}
.lb{font-size:.82rem;color:var(--sub);font-weight:600;letter-spacing:.02em}
.dv{height:1px;background:var(--line);margin:10px 0}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card.flat{border:0;background:transparent;border-radius:0}
.card>.it+.it,.card>.prow+.prow,.card>.swr+.swr,.card>.padi+.padi,.card>.faq+.faq{border-top:1px solid var(--line)}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;color:var(--text);text-align:left;font:inherit;cursor:pointer;min-height:64px}
.it:active{background:var(--chip)}
.it.danger .tt,.it.danger .ic{color:var(--red)}
.it.dis{opacity:.5}
.ic{width:44px;height:44px;border-radius:14px;background:var(--chip);color:var(--acct);display:grid;place-items:center;flex:none}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;text-align:left}
.tt{font-weight:600;font-size:1.02rem;color:var(--text)}
.tt.big{font-size:1.2rem}.tt.sm{font-size:.95rem}
.ds{font-size:.86rem;color:var(--sub);line-height:1.4}
.ds2{font-size:.88rem;color:var(--sub2);margin:4px 0}
.ch{color:var(--dim2);display:grid;flex:none}
.pl{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--sub2);flex:none;white-space:nowrap}
.pl.k1{background:var(--mintbg);color:var(--mint)}.pl.k2{background:var(--redbg);color:var(--red)}.pl.k3{background:var(--accsoft);color:var(--acct)}
.prow{display:flex;align-items:center;padding-right:8px}
.tag{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--sub2);white-space:nowrap}
.tag.on{background:var(--accsoft);color:var(--acct)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.92rem}.kv span{color:var(--sub)}.kv b{text-align:right}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--accent);color:var(--onacc);font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.dng{background:var(--red);color:#2a0a0a}.btn.dng.ghost{background:var(--redbg);color:var(--red)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:13px}
.btn.stop{background:var(--chip2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row2.tight{gap:4px}.row2.sv{margin-top:4px}
.row2.sv .btn{flex:1}
.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}.btn-col{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;align-items:center}.inline .fld{flex:1;min-width:0}
.fld{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem;outline:none;min-width:0}
.fld:focus{border-color:var(--accent)}
.fld::placeholder{color:var(--dim)}
textarea.fld{resize:vertical;line-height:1.5}
.fld.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem}
.fld.bare{border:0;background:transparent;padding:0}
select.fld{appearance:auto}
.doc-out{min-height:260px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:99px;background:var(--chip);color:var(--text2);border:1.5px solid transparent;font:inherit;font-size:.9rem;cursor:pointer;flex:none}
.chip.on{background:var(--accsoft);color:var(--acct);border-color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:2px}
.sg{flex:1;padding:9px 4px;border-radius:11px;border:0;background:none;color:var(--sub2);font:inherit;font-size:.9rem;cursor:pointer}
.sg.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.swr,.ckr{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.swi{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--chip2);position:relative;flex:none;transition:.2s;margin:0;cursor:pointer}
.swi::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.swi:checked{background:var(--accent)}.swi:checked::after{transform:translateX(20px)}
.cki{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--dim2);flex:none;position:relative;margin:0;cursor:pointer}
.cki:checked{background:var(--accent);border-color:var(--accent)}
.cki:checked::after{content:'';position:absolute;left:5px;top:5px;width:10px;height:6px;border-left:2.5px solid var(--onacc);border-bottom:2.5px solid var(--onacc);transform:rotate(-45deg)}
.ckr.dis{opacity:.5}.dimmed{opacity:.4;pointer-events:none}
.rgp{display:flex;flex-direction:column}
.ro,.pk{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);font:inherit;padding:10px 0;text-align:left;cursor:pointer}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim2);flex:none;position:relative}
.rd.on{border-color:var(--accent)}.rd.on::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.rng{width:100%;accent-color:var(--accent);margin:6px 0}
.sl{display:flex;flex-direction:column}.sl-h{display:flex;justify-content:space-between;font-size:.9rem;color:var(--sub2)}
.spd{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--sub)}.spd b{color:var(--text)}
.spd2{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim);margin-bottom:8px}
.themes{display:flex;gap:10px}
.th{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;border:2px solid var(--line);background:var(--chip);color:var(--text2);font:inherit;cursor:pointer}
.th.on{border-color:var(--accent);color:var(--acct)}
.accs{display:flex;gap:12px;flex-wrap:wrap}
.acc{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);padding:0}
.acc.on{border-color:var(--text)}.accs.sm .acc{width:32px;height:32px}
.prev{padding:10px;border-radius:16px;background-color:var(--chatbg);background-image:var(--chatimg);background-size:cover;background-position:center;border:1px solid var(--line)}
.pm{max-width:82%;padding:10px 14px;border-radius:18px;margin:6px 0;font-size:.95rem}
.pm.a{background:var(--chip)}.pm.u{background:var(--accent);color:var(--onacc);margin-left:auto}
.bgprev{height:48px;border-radius:10px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:7px 8px;border-radius:10px;background:none;border:0;color:var(--dim);font:inherit;font-size:.82rem;cursor:pointer}
.mini.on{color:var(--acct)}.mini.txt{background:var(--chip);color:var(--text2);padding:7px 11px}
.link{background:none;border:0;color:var(--acct);font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:4px;padding:4px 0;cursor:pointer}
.exp{margin:6px 0;color:var(--text2);line-height:1.55}
.tool-note{display:flex;gap:8px;align-items:flex-start;background:var(--accsoft);color:var(--text2);border-radius:14px;padding:10px 12px;font-size:.86rem;line-height:1.5}
.tool-note svg{margin-top:2px;color:var(--acct)}
.cta-w{flex:none;padding:10px var(--gxr) 14px var(--gx)}
.cta{width:100%;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--onacc);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.cta-pad{height:12px}

/* home */
.home-h{display:flex;align-items:center;gap:4px;padding:10px var(--gxr) 4px var(--gx);flex:none}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:0;background:none;color:var(--text);cursor:pointer;flex:none}
.ib.mint{color:var(--mint)}.ib.dim{color:var(--dim)}.ib.sq{background:var(--chip);border-radius:14px}
.feed{flex:1;min-height:0;overflow-y:auto;padding:8px var(--gxr) 16px var(--gx);display:flex;flex-direction:column;gap:16px;background-color:var(--chatbg);background-image:var(--chatimg);background-size:cover;background-position:center;overscroll-behavior:contain}
.feed.empty{justify-content:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.hello{font-size:1.7rem;font-weight:800;line-height:1.2}.hello-s{font-size:1.2rem;color:var(--sub2);margin-top:8px}
.orb-o{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1A2240 0,#121A33 100%);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE3B0,#FFB547 40%,#FF8A3D 70%,#E8572E);box-shadow:0 0 40px rgba(255,138,61,.45);animation:breathe 4s ease-in-out infinite}
.orb-o.big{width:280px;height:280px;max-width:70vw;max-height:70vw}.orb-o.big .orb{width:190px;height:190px;max-width:48vw;max-height:48vw}
.orb.listen{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 70px rgba(94,224,200,.55);background:radial-gradient(circle at 35% 30%,#D6FFF5,#5EE0C8 45%,#2BAE96 75%,#1B7D74)}
.orb.think{animation:spin 2.2s linear infinite;border-radius:42% 58% 55% 45%}
.orb.speak{animation:talk .7s ease-in-out infinite}
.remind{display:flex;gap:8px;align-items:center;background:var(--accsoft);color:var(--acct);border:0;border-radius:14px;padding:10px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.m{display:flex;flex-direction:column;max-width:100%;min-width:0}.m.u{align-items:flex-end}
.m.u .b{background:var(--accent);color:var(--onacc);padding:10px 14px;border-radius:20px 20px 6px 20px;max-width:88%;overflow-wrap:anywhere;white-space:normal}
.m.a .b{width:100%;padding:2px 0;min-width:0}
.acts{display:flex;align-items:center;gap:0;margin-top:4px;color:var(--dim);flex-wrap:wrap}
.meta{font-size:.74rem;margin-right:auto;color:var(--dim2)}
.attrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.attc{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--text2);padding:6px 10px;border-radius:99px;font-size:.82rem;max-width:100%}
.m.u .attc{background:rgba(0,0,0,.12);color:inherit}
.attc .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.attc button{background:none;border:0;color:inherit;display:grid;padding:0;cursor:pointer}
.atts{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 8px}
.vbadge{display:flex;gap:6px;align-items:flex-start;margin-top:8px;font-size:.85rem;padding:8px 10px;border-radius:12px}
.vbadge.ok{background:var(--okbg);color:var(--ok)}.vbadge.warn{background:var(--redbg);color:var(--red)}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin:0 2px;animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.thinking{color:var(--sub);font-size:.92rem}
.comp-w{flex:none;padding:6px var(--gxr) 10px var(--gx)}
.comp{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 14px 8px}
#inp{width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:1.05rem;resize:none;outline:none;max-height:150px;padding:2px 2px 8px;display:block}
#inp::placeholder{color:var(--dim)}
.comp-r{display:flex;align-items:center;gap:2px}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--onacc);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.send.stop{background:var(--chip2);color:var(--text)}.send.sm{width:40px;height:40px}
.mic-on{color:var(--red)!important;animation:pulse 1s infinite}

/* markdown */
.md{overflow-wrap:anywhere;line-height:1.65;min-width:0}
.md p{margin:.45em 0}.md h2,.md h3,.md h4,.md h5{margin:1em 0 .35em;line-height:1.3}.md h2{font-size:1.2rem}.md h3{font-size:1.1rem}.md h4,.md h5{font-size:1rem}
.md ul,.md ol{padding-left:1.35em;margin:.4em 0}.md li{margin:.2em 0}.md li.l1{margin-left:1em}.md li.l2{margin-left:2em}
.md code{background:var(--chip);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.md blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:2px 0 2px 12px;color:var(--sub2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}.md a{color:var(--acct)}
.tbl{overflow-x:auto;margin:.6em 0;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;min-width:100%;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--chip);white-space:nowrap}.tbl tr:last-child td{border-bottom:0}
.code{background:var(--codebg);color:#E6EAF7;border-radius:14px;overflow:hidden;margin:.7em 0}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 4px 14px;background:rgba(255,255,255,.07);font-size:.78rem;color:#9aa5c7}
.code .mini{color:#c8d0ea}
.code pre{margin:0;padding:12px 14px;overflow-x:auto}

let toastT;
function toast(msg,ms=2800,action){
  let t=$('#toast');
  if(!t){t=mk('<div id="toast" role="status" aria-live="polite"></div>');$('#app').append(t)}
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="toast-a">${esc(action.t)}</button>`:''}`;
  if(action) $('.toast-a',t).onclick=()=>{t.classList.remove('on');action.f()};
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);
}

const sheetStack=[];
function openSheet({title='',html='',cls='',onMount,onClose}={}){
  const back=mk(`<div class="sheet-back"><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><div class="sheet-t">${esc(title)}</div><button class="xbtn" data-close aria-label="बंद करें">${ic('close',20)}</button></div><div class="sheet-b">${html}</div></div></div>`);
  $('#app').append(back);
  const api={el:back,sheet:$('.sheet',back),body:$('.sheet-b',back),closed:false,
    close(){if(api.closed)return;api.closed=true;back.classList.remove('on');const i=sheetStack.indexOf(api);if(i>=0)sheetStack.splice(i,1);setTimeout(()=>back.remove(),S.reduce?0:200);onClose&&onClose()}};
  back.addEventListener('click',e=>{if(e.target===back||e.target.closest('[data-close]'))api.close()});
  sheetStack.push(api);
  requestAnimationFrame(()=>back.classList.add('on'));
  onMount&&onMount(api);
  return api;
}
function pickSheet({title,options,current,onPick,note=''}){

  const sh=openSheet({title,html});

  return sh;
}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('कॉपी हो गया');return true}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.append(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();toast(ok?'कॉपी हो गया':'कॉपी नहीं हो सका — टेक्स्ट चुनकर कॉपी करें');return ok;
  }
}

const LIBS={
  jszip:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip],
  xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX],

};

const _lp={};
function need(k){
  const [u,t]=LIBS[k];
  if(t())return Promise.resolve(t());
  return _lp[k]||(_lp[k]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=u;
    s.onload=()=>t()?res(t()):rej(new Error('lib '+k));
    s.onerror=()=>{delete _lp[k];rej(new Error('lib-load '+k))};
    document.head.append(s);
  }));
}
let _dl;
async function getDL(){
  if(_dl!==undefined)return _dl;
  try{_dl=window.claude?await window.claude.use('downloads'):null}catch(e){_dl=null}
  return _dl;
}
async function saveFile(name,data){
  const dl=await getDL();
  if(!dl){
    /* Android ऐप: नेटिव सेव (WebView में blob डाउनलोड नहीं चलता) */
    if(window.ApnaAndroid&&window.ApnaAndroid.saveFile){
      try{
        const blob=data instanceof Blob?data:new Blob([data]);
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});
        const ok=window.ApnaAndroid.saveFile(name,blob.type||'application/octet-stream',b64);
        toast(ok?'Downloads फ़ोल्डर में सेव हो गई':'फ़ाइल सेव नहीं हो सकी');return !!ok;
      }catch(e){toast('फ़ाइल सेव नहीं हो सकी');return false}
    }
    /* स्टैंडअलोन वेबसाइट: सामान्य ब्राउज़र डाउनलोड */
    try{
      const blob=data instanceof Blob?data:new Blob([data]);
      const u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=name;document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),30000);toast('फ़ाइल डाउनलोड हो रही है');return true;
    }catch(e){toast('फ़ाइल सेव नहीं हो सकी');return false}
  }
  try{await dl.save({filename:name,data});toast('फ़ाइल सेव हो गई');return true}
  catch(e){
    const m={declined:'सेव रद्द किया',rate_limited:'पिछला सेव पूरा होने दें, फिर कोशिश करें',too_large:'फ़ाइल बहुत बड़ी है',rejected_extension:'यह फ़ाइल-प्रकार यहाँ सेव नहीं हो सकता',bad_request:'फ़ाइल खाली है या नाम गलत है'}[e&&e.code];
    toast(m||'फ़ाइल सेव नहीं हो सकी');return false;
  }
}

/* ================= navigation ================= */
const SCREENS={};
const NAV=[];
const topRec=()=>NAV[NAV.length-1];
function go(id,params={}){
  const def=SCREENS[id];
  if(!def){toast('यह स्क्रीन उपलब्ध नहीं है');return null}
  const prev=topRec();
  const node=document.createElement('section');
  node.className='screen from-'+(def.from||'right')+(def.cls?' '+def.cls:'');
  node.dataset.id=id;
  $('#screens').append(node);
  const rec={id,node,def,params};
  NAV.push(rec);
  try{def.render(node,params,rec)}catch(e){console.error('render '+id,e);node.innerHTML=`<header class="hd"><button class="bk" data-back aria-label="वापस">${ic('back',24)}</button><h1>गड़बड़ी</h1></header><p class="note pad">यह स्क्रीन नहीं खुल सकी।</p>`}
  bindNav(node);
  if(prev){prev.node.classList.add('under');prev.node.setAttribute('inert','')}
  requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.add('in')));
  return rec;
}
function back(){
  if(NAV.length<2)return;
  const rec=NAV.pop(),prev=topRec();
  prev.node.classList.remove('under');prev.node.removeAttribute('inert');
  rec.node.classList.remove('in');rec.node.classList.add('out');
  rec.def.onLeave&&rec.def.onLeave(rec);
  setTimeout(()=>rec.node.remove(),S.reduce?0:230);
  prev.def.onShow&&prev.def.onShow(prev);

function extractJSON(t){
  t=String(t||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(f){try{return JSON.parse(f[1].trim())}catch(e){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  const err=new Error('invalid json');err.code='invalid_json';err.text=t;throw err;
}

/* फ़ोटो को छोटा करके data URL बनाओ (Worker की 1 MB सीमा के भीतर रहने के लिए) */
async function visionDataUrl(blob,maxChars){
  let bmp=null,url=null;
  try{bmp=await createImageBitmap(blob)}catch(e){}
  if(!bmp){
    url=URL.createObjectURL(blob);
    bmp=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no({code:'image_rejected'});im.src=url});
  }
  try{
    const W0=bmp.width||bmp.naturalWidth,H0=bmp.height||bmp.naturalHeight;
    if(!W0||!H0)throw {code:'image_rejected'};
    let side=1600,q=.82,out='';
    for(let i=0;i<7;i++){
      const k=Math.min(1,side/Math.max(W0,H0));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(W0*k));cv.height=Math.max(1,Math.round(H0*k));
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
      out=cv.toDataURL('image/jpeg',q);
      if(out.length<=maxChars)return out;
      side=Math.round(side*.75);q=Math.max(.5,q-.06);
    }
    throw {code:'image_rejected'};
  }finally{if(url)URL.revokeObjectURL(url)}
}
function makeOpenAI(c){
  const visionOk=c.vision===true||/\/(gemini|openai)\/v1\/?$/i.test(c.url||'');
  const extra=c.imgModel?{async img(o){
    const base=c.url.replace(/\/+$/,'');
    const SZ={'1:1':'1024x1024','4:5':'1024x1280','16:9':'1792x1024','9:16':'1024x1792'};
    const go=async size=>{
      try{return await fetch(base+'/images/generations',{method:'POST',signal:o.signal,headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify({model:c.imgModel,prompt:o.prompt,size,n:1,response_format:'b64_json'})})}
      catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled',message:'रोका गया'};throw {code:'network',message:'इमेज सर्वर से कनेक्शन नहीं हो सका।'}}
    };
    let size=SZ[o.ratio]||'1024x1024';
    let res=await go(size);
    /* कुछ सेवाएँ बड़े/अलग आकार नहीं लेतीं: चौकोर आकार पर एक बार दोबारा */
    if(!res.ok&&res.status===400&&size!=='1024x1024')res=await go('1024x1024');
    if(!res.ok){
      let pm='';try{const j=await res.json();if(j&&j.error&&typeof j.error.message==='string')pm=j.error.message.slice(0,200)}catch(e){}
      throw {code:'http_'+res.status,message:pm||('इमेज सर्वर ने '+res.status+' लौटाया। मॉडल का नाम जाँचें।')};
    }
    const j=await res.json(),d=j.data&&j.data[0];
    if(d&&d.b64_json)return 'data:image/png;base64,'+d.b64_json;if(d&&d.url)return d.url;
    throw {code:'bad',message:'इमेज सर्वर से तस्वीर नहीं मिली।'};
  }}:{};
  return{id:c.id,label:c.name,desc:c.model+' · '+c.url+(c.imgModel?' · इमेज: '+c.imgModel:''),vision:visionOk,custom:true,...extra,
    async ask(o){
      const base=c.url.replace(/\/+$/,'');
      const turns=turnsOf(o);
      let sys=o.system||'';
      if(o.json)sys+='\n\nकेवल वैध JSON लौटाओ, उसके बाहर कोई टेक्स्ट नहीं।';
      const msgs=(sys?[{role:'system',content:sys}]:[]).concat(turns);
      if(o.images&&o.images.length){
        const imgs=o.images.slice(0,c.maxImg||4);
        const per=Math.floor(520000/imgs.length);
        const urls=[];
        for(const b of imgs){try{urls.push(await visionDataUrl(b,per))}catch(e){throw {code:'image_rejected',message:ERRS.image_rejected}}}
        const last=msgs[msgs.length-1];
        if(last&&last.role==='user')last.content=[{type:'text',text:String(last.content||'')||'इस फ़ोटो के बारे में बताओ।'}].concat(urls.map(u=>({type:'image_url',image_url:{url:u}})));
      }
      /* इंटरनेट खोज: Worker का /gemini/search (Gemini + Google Search); सिर्फ़ Gemini लाइन पर */
      let prefix='';
      if(o.web&&!o.json&&!(o.images&&o.images.length)&&/\/gemini\/v1\/?$/i.test(c.url||'')){
        try{
          let rs;
          try{rs=await fetch(base.replace(/\/v1$/i,'/search'),{method:'POST',signal:o.signal,headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify({model:c.model,messages:msgs})})}
          catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled',message:'रोका गया'};throw {code:'network',message:'खोज-सर्वर से कनेक्शन नहीं हो सका।'}}
          if(!rs.ok)throw {code:'http_'+rs.status,message:''};
          const j=await rs.json();const t=String(j.text||'').trim();
          if(!t)throw {code:'empty',message:''};
          const src=(Array.isArray(j.sources)?j.sources:[]).slice(0,6).filter(x=>x&&/^https?:\/\//.test(x.url)).map(x=>'- ['+String(x.title||x.url).replace(/[\[\]]/g,'')+']('+x.url+')').join('\n');
          const qs=(Array.isArray(j.queries)?j.queries:[]).filter(x=>typeof x==='string').slice(0,3);
          /* Gemini ने सच में खोजा हो तभी "इंटरनेट से" लिखो; न खोजा हो तो सामान्य जवाब */
          const searched=qs.length>0||!!src;
          const out=(searched?'🌐 *यह जवाब इंटरनेट से लिया गया है'+(qs.length?' (खोजा: '+qs.join(', ')+')':'')+'।*\n\n':'')+t+(src?'\n\n**स्रोत (वेबसाइट):**\n'+src:'');
          o.onText&&o.onText(out);return {text:out,truncated:false};
        }catch(e){
          if(e&&e.code==='cancelled')throw e;
          /* खोज न चले तो रुकने की जगह सामान्य जवाब दो, और साफ़ बताओ */
          const why=e&&e.code==='http_429'?'Google ने इस खाते पर खोज की अनुमति/कोटा नहीं दिया':(e&&e.code==='http_404'?'Worker में नया कोड नहीं है':'खोज अभी नहीं चल सकी');
          prefix='⚠ *इंटरनेट खोज नहीं हो सकी ('+why+'), इसलिए यह मेरी पुरानी जानकारी से जवाब है — ताज़ा नहीं हो सकता।*\n\n';
        }
      }
      let res;
      /* "तेज़" मोड: Gemini लाइन पर अपने-आप सबसे तेज़ मॉडल (Flash-Lite) और छोटा जवाब; वह न चले तो सामान्य मॉडल */
      const quick=o.tier==='quick'&&!o.json;
      const fastM=o.tier==='quick'?(c.fastModel||(/\/gemini\/v1\/?$/i.test(c.url||'')?'gemini-3.5-flash-lite':'')):'';
      const call=m=>fetch(base+'/chat/completions',{method:'POST',signal:o.signal,
          headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),
          body:JSON.stringify(Object.assign({model:m,stream:!o.json,messages:msgs},quick?{max_tokens:1500}:{}))});
      try{
        res=await call(fastM&&fastM!==c.model?fastM:c.model);
        if(!res.ok&&fastM&&fastM!==c.model&&(res.status===400||res.status===404))res=await call(c.model);
      }catch(e){
        if(e&&e.name==='AbortError')throw {code:'cancelled',message:'रोका गया'};
        throw {code:'network',message:'सर्वर से कनेक्शन नहीं हो सका। इंटरनेट, Base URL और Worker का ALLOWED_ORIGIN (इस साइट का पता) जाँचें।'};
      }
      if(!res.ok){
        let pm='';try{const j=await res.json();if(j&&j.error&&j.error.type==='proxy_error'&&typeof j.error.message==='string')pm=j.error.message.slice(0,220)}catch(e){}
        throw {code:'http_'+res.status,message:pm||('सर्वर ने '+res.status+' लौटाया। URL, key और मॉडल का नाम जाँचें।')};
      }
      if(o.json){const j=await res.json();return extractJSON(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)}
      const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');buf=lines.pop();
        for(const ln of lines){
          const s=ln.trim();if(!s.startsWith('data:'))continue;
          const d=s.slice(5).trim();if(d==='[DONE]')continue;
          try{const j=JSON.parse(d);const t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(t){out+=t;o.onText&&o.onText(prefix+out)}}catch(e){}
        }
      }
      return {text:prefix+out,truncated:false};
    },
  };
}

function needsWeb(t){

/* ================= इंटरनेट खोज (Tavily + Wikipedia, Worker के ज़रिए) =================
   चाबियाँ ऐप में नहीं हैं; सब Cloudflare Worker में हैं। खोजना है या नहीं, यह सवाल देखकर अपने-आप तय होता है। */
const SRC_NAME={tavily:'Tavily वेब-खोज',wikipedia:'Wikipedia',espn:'ESPN लाइव स्कोर'};
function searchEndpoint(){
  const c=(S.customs||[]).find(x=>/\/(gemini|openai)\/v1\/?$/i.test(x.url||''));
  return c?{url:c.url.replace(/\/(gemini|openai)\/v1\/?$/i,'/search'),key:c.key||''}:null;
}
function searchPlan(t){
  const sr=S.search||{};if(!sr.on)return null;
  t=String(t||'').trim();if(!t||t.length>500)return null;
  const news=needsWeb(t);
  /* लिखने/बनाने/समझाने के काम में खोज की ज़रूरत नहीं (सिर्फ़ ताज़ा-खबर वाले शब्द हों तो ही) */
  const make=/(लिखो|लिखें|लिखिए|लिख दो|बनाओ|बनाइए|अनुवाद|translate|write|कविता|poem|निबंध|essay|कोड|code|सारांश|summar|समझाओ|समझाइए|हल करो|solve|\d+\s*[+\-*/×÷]\s*\d+)/i.test(t);
  const hot0=/(खबर|ख़बर|समाचार|न्यूज़|न्यूज|news|आज|today|latest|ताज़ा|ताजा|अभी|\bvs\.?\b|versus|match|live|score|मैच|लाइव|बनाम)/i.test(t);
  if(make&&!hot0)return null;
  const gk=/(क्या है|क्या होता|कौन था|कौन थे|कौन थी|कब हुआ|कब हुई|किसने|जीवनी|परिभाषा|what is|what are|who was|who is|history of|define|meaning of)/i.test(t);
  if(!news&&!gk)return null;
  const hot=hot0;
  let p;
  if(hot||(news&&!gk))p={tavily:!!sr.tavily,wikipedia:false,topic:hot?'news':'general'};
  else if(gk&&!news)p={tavily:false,wikipedia:!!sr.wiki,topic:'general',fb:!!sr.tavily};
  else p={tavily:!!sr.tavily,wikipedia:!!sr.wiki,topic:hot?'news':'general'};
  if(!p.tavily&&!p.wikipedia&&!p.fb)return null;
  p.scores=/(\bvs\.?\b|versus|match|live|score|fixture|मैच|लाइव|बनाम|स्कोर)/i.test(t);
  p.q=t;return p;
}
async function webSearch(p,signal){
  const ep=searchEndpoint();
  if(!ep)throw {code:'no_worker',message:'इंटरनेट खोज के लिए Worker वाला मॉडल (सेटिंग्स → AI मॉडल) जुड़ा नहीं है'};
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),25000);
  const onAbort=()=>ac.abort();if(signal)signal.addEventListener('abort',onAbort);
  const call=async q=>{
    let r;
    try{r=await fetch(ep.url,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+ep.key},body:JSON.stringify(q)})}
    catch(e){
      if(signal&&signal.aborted)throw {code:'cancelled',message:'रोका गया'};
      throw {code:'network',message:e&&e.name==='AbortError'?'खोज में बहुत देर लगी':'खोज-सर्वर से कनेक्शन नहीं हो सका'};
    }
    if(r.status===404)throw {code:'http_404',message:'Worker में नया खोज-कोड नहीं है'};
    if(!r.ok)throw {code:'http_'+r.status,message:'खोज-सर्वर ने '+r.status+' लौटाया'};
    return r.json();
  };
  try{
    let j=await call({query:p.q,topic:p.topic,tavily:p.tavily,wikipedia:p.wikipedia,scores:p.scores===true});
    let results=Array.isArray(j.results)?j.results:[],notes=Array.isArray(j.notes)?j.notes:[];
    if(!results.length&&p.fb){const j2=await call({query:p.q,topic:p.topic,tavily:true,wikipedia:false});results=Array.isArray(j2.results)?j2.results:[];notes=notes.concat(j2.notes||[])}
    results=results.filter(x=>x&&/^https?:\/\//.test(x.url)).slice(0,8);
    return {results,notes};
  }finally{clearTimeout(tm);if(signal)signal.removeEventListener('abort',onAbort)}
}

async function ai(o){
  const p=PROV[o.provider||S.provider]||PROV.claude;
  /* फ़ोटो हो और चुना हुआ AI फ़ोटो न समझता हो (जैसे Groq का GPT OSS) तो इस संदेश के लिए फ़ोटो समझने वाला दूसरा AI (Gemini/OpenAI) */
  const useP=(o.images&&o.images.length&&!p.vision)?(Object.values(PROV).find(x=>x.custom&&x.vision)||PROV.claude):p;
  const t0=performance.now();
  const res=await useP.ask(o);
  if(res&&typeof res==='object')res.prov=useP.id;
  if(o.track!==false){
    const chars=(typeof res==='object'&&res&&res.text)?res.text.length:0;
    track(o.kind==='msg'?'msg':'tool',{tier:o.tier||'default',prov:useP.id,ms:performance.now()-t0,chars});
  }
  return res;
}

/* ================= markdown ================= */
function inl(s){
  return s.split(/(`[^`\n]+`)/).map((p,i)=>{
    if(i%2)return '<code>'+esc(p.slice(1,-1))+'</code>';
    let t=esc(p);
    t=t.replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+?)__/g,'<b>$1</b>');
    t=t.replace(/(^|[\s(>])\*([^*\s][^*\n]*?)\*(?=[\s).,!?:;<]|$)/g,'$1<i>$2</i>');
    t=t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }).join('');
}
const codeBox=(lang,code)=>`<div class="code"><div class="code-h"><span>${esc(lang||'कोड')}</span><button class="mini" data-copy aria-label="कोड कॉपी करें">${ic('copy',15)} कॉपी</button></div><pre><code>${esc(code)}</code></pre></div>`;
function md(src){
  const L=String(src||'').replace(/\r/g,'').split('\n');let o='',i=0,m;
  const isBlock=l=>/^```/.test(l)||/^#{1,4}\s/.test(l)||/^\s*([-*•])\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)||/^>\s?/.test(l)||/^\s*\|.*\|\s*$/.test(l)||/^\s*(-{3,}|\*{3,})\s*$/.test(l);
  while(i<L.length){
    const ln=L[i];
    if((m=ln.match(/^```\s*([\w+#.-]*)\s*$/))){
      const code=[];i++;
      while(i<L.length&&!/^```\s*$/.test(L[i]))code.push(L[i++]);
      i++;o+=codeBox(m[1],code.join('\n'));continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const head=cells(ln);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(cells(L[i++]));
      o+=`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;

    const pid=3+i*3,cid=pid+1,iid=pid+2,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(pid,()=>w(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid,()=>w(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));

  });

}
const csvEnc=rows=>'﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n\r;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
function csvDec(t){
  t=String(t).replace(/^﻿/,'');
  const first=t.split(/\r?\n/,1)[0]||'';
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

const xmlDec=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function readPdfText(file){
  const lib=await need('pdfjs');
  try{lib.GlobalWorkerOptions.workerSrc=PDF_WORKER}catch(e){}
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[],n=Math.min(doc.numPages,300);
  for(let p=1;p<=n;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();out.push(tc.items.map(i=>i.str).join(' '))}
  return out.join('\n\n');
}
async function readFileAny(file){
  const name=file.name,ext=(name.split('.').pop()||'').toLowerCase();
  if((file.type||'').startsWith('image/')||['png','jpg','jpeg','webp','gif'].includes(ext))return{kind:'image',name,blob:file};
  if(['xlsx','xls','xlsm'].includes(ext)){
    const X=await need('xlsx');const wb=X.read(await file.arrayBuffer(),{type:'array'});
    const sheets=wb.SheetNames.map(n=>({name:n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})}));
    return{kind:'table',name,sheets,text:sheets.map(s=>'# '+s.name+'\n'+s.rows.slice(0,800).map(r=>r.join(' | ')).join('\n')).join('\n\n')};
  }
  if(ext==='csv'||ext==='tsv'){const t=await file.text();return{kind:'table',name,sheets:[{name:'Sheet1',rows:csvDec(t)}],text:t}}
  if(ext==='docx'){
    const Z=await need('jszip');const z=await Z.loadAsync(await file.arrayBuffer());
    const f=z.file('word/document.xml');if(!f)throw new Error('docx');
    const x=await f.async('string');
    return{kind:'text',name,text:xmlDec(x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,''))};
  }
  if(ext==='pdf'){
    const text=await readPdfText(file);
    if(text.replace(/\s/g,'').length<20)throw Object.assign(new Error('scan'),{code:'scanned_pdf',message:'यह स्कैन की हुई PDF लगती है, इसमें पढ़ने लायक टेक्स्ट नहीं मिला। पेजों की फ़ोटो भेजकर देखें।'});
    return{kind:'text',name,text};
  }
  return{kind:'text',name,text:await file.text()};
}
function pickFiles({accept='',multiple=false,capture=''}={}){
  /* Android ऐप: फ़ोन का अपना चुनने वाला (गैलरी/कैमरा/फ़ाइलें) और फ़ाइल सीधे ऐप तक — WebView की फ़ाइल-खिड़की पर निर्भर नहीं */
  if(window.ApnaAndroid&&window.ApnaAndroid.pick){
    return new Promise(res=>{
      const kind=capture?'cam':(/^image\//.test(accept)?'img':'file');
      const bufs={},jobs=[],files=[];
      window.__apnaPick=m=>{
        if(!m)return;
        if(m.t==='c'){
          const b=bufs[m.id]||(bufs[m.id]={parts:[],got:0,name:m.name,mime:m.mime});
          b.parts[m.i]=m.d;b.got++;
          if(b.got===m.n){
            const nm=b.name,mt=b.mime,all=b.parts.join('');delete bufs[m.id];
            jobs.push(fetch('data:'+mt+';base64,'+all).then(r=>r.blob()).then(bl=>{files.push(new File([bl],nm,{type:mt}))}).catch(()=>{}));
          }
        }else if(m.t==='done'){
          Promise.all(jobs).then(()=>{window.__apnaPick=null;res(files)});
        }
      };
      try{window.ApnaAndroid.pick(kind)}catch(e){window.__apnaPick=null;res([])}
    });
  }
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=multiple;if(capture)i.setAttribute('capture',capture);i.style.display='none';
    document.body.append(i);
    i.onchange=()=>{const f=Array.from(i.files||[]);i.remove();res(f)};
    i.addEventListener('cancel',()=>{i.remove();res([])});
    i.click();
  });
}

const Lib={
  mem:[],db:null,bad:false,
  async open(){
    if(this.db)return this.db;
    this.db=await new Promise((res,rej)=>{const r=indexedDB.open('apna-ai',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    return this.db;
  },
  async tx(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{const t=db.transaction('files',mode);const rq=fn(t.objectStore('files'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)});
  },
  async list(){if(this.bad)return this.mem.slice();try{return(await this.tx('readonly',s=>s.getAll()))||[]}catch(e){this.bad=true;return this.mem.slice()}},
  async add(rec){if(!this.bad){try{await this.tx('readwrite',s=>s.put(rec));return}catch(e){this.bad=true}}this.mem.push(rec)},
  async remove(id){if(!this.bad){try{await this.tx('readwrite',s=>s.delete(id));return}catch(e){this.bad=true}}this.mem=this.mem.filter(f=>f.id!==id)},
  async clear(){if(!this.bad){try{await this.tx('readwrite',s=>s.clear())}catch(e){this.bad=true}}this.mem=[]}
};
const tokens=s=>(String(s).toLowerCase().match(/[\p{L}\p{M}\p{N}]+/gu)||[]);
function chunkText(text,size=1100,overlap=140){
  const out=[];text=String(text).replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');let i=0;
  while(i<text.length){
    let end=Math.min(text.length,i+size);
    if(end<text.length){const a=Math.max(text.lastIndexOf('\n',end),text.lastIndexOf('। ',end),text.lastIndexOf('. ',end));if(a>i+size*.5)end=a+1}
    out.push(text.slice(i,end).trim());
    if(end>=text.length)break;
    i=Math.max(end-overlap,i+1);
  }
  return out.filter(Boolean);
}
function retrieve(files,query,k=6){
  const docs=[];
  files.forEach(f=>chunkText(f.text).forEach((c,idx)=>docs.push({f:f.name,n:idx+1,t:c,tk:tokens(c)})));
  const q=[...new Set(tokens(query))].filter(w=>w.length>1);
  const N=docs.length||1,df={};q.forEach(w=>{df[w]=0});
  docs.forEach(d=>{const set=new Set(d.tk);q.forEach(w=>{if(set.has(w))df[w]++})});
  docs.forEach(d=>{
    const tf={};d.tk.forEach(w=>{tf[w]=(tf[w]||0)+1});let s=0;
    q.forEach(w=>{if(tf[w]){const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5));s+=idf*(tf[w]*2.2)/(tf[w]+1.2*(.25+.75*d.tk.length/180))}});
    d.s=s;
  });
  return docs.filter(d=>d.s>0).sort((a,b)=>b.s-a.s).slice(0,k);
}

        if(!voice)wpre='⚠ *इंटरनेट खोज नहीं हो सकी ('+((e&&e.message)||'गड़बड़')+'), इसलिए यह मेरी पुरानी जानकारी से जवाब है — ताज़ा नहीं हो सकता।*\n\n';
      }
    }
    const hist=historyForModel();
    if(wextra){const li=hist.map(x=>x.role).lastIndexOf('user');if(li>=0)hist[li]={...hist[li],content:wextra+'\n\n---\nयूज़र का सवाल: '+(typeof hist[li].content==='string'?hist[li].content:text)}}
    const r=await ai({turns:hist,system:sysPrompt({voice,web:!!wextra}),tier,effort:(S.deep&&tier==='complex')?'high':undefined,images:imgs,web:false,signal:ctrl.signal,kind:'msg',onText:wpre?(t=>liveUpdate(wpre+t)):liveUpdate});
    reply=wpre+r.text+wsrc;cut=r.truncated;usedProv=r.prov||'';
  }catch(e){
    err=e;reply=(e&&e.text)||liveText||'';
  }
  const aborted=err&&err.code==='cancelled';
  busy=false;ctrl=null;liveText='';setSendIcon();
  if(err&&!aborted&&!reply){
    cur.turns.push({id:uid(),role:'assistant',content:'⚠ '+errMsg(err),by:'',err:true,ts:Date.now()});
  }else if(reply){
    const up=PROV[usedProv]||prov;
    const label=up&&up.custom?up.label:'Claude · '+(TIER_NAME[tier]||'');
    cur.turns.push({id:uid(),role:'assistant',content:reply+(cut?'\n\n_(जवाब लंबाई की सीमा पर कट गया — “आगे बढ़ाओ” लिखें।)_':'')+(aborted?'\n\n_(रोका गया)_':''),by:label+' · '+((performance.now()-t0)/1000).toFixed(1)+' सेकंड',ts:Date.now(),voice});
  }
  cur.updated=Date.now();
  if(cur.turns.length===1||cur.title==='नई चैट'){const f=cur.turns.find(t=>t.role==='user');if(f)cur.title=f.content.replace(/\s+/g,' ').slice(0,42)||'नई चैट'}
  ensureSaved();persist();paintFeed(true);
  if(!aborted&&!err)notifyReply();
  if(S.verify&&reply&&!err&&!aborted&&reply.length>60&&tier!=='quick')autoVerify(cur.turns.length-1);
  return reply;
}
async function autoVerify(i){
  const t=cur.turns[i];if(!t||t.role!=='assistant'||t.v)return;
  const q=[...cur.turns.slice(0,i)].reverse().find(x=>x.role==='user');if(!q)return;
  try{toast('जवाब को दोबारा जाँच रहा हूँ…',2000);t.v=await verifyAnswer(q.content,t.content);persist();paintFeed()}
  catch(e){toast(errMsg(e))}
}
async function sendMessage(text){
  text=(text||'').trim();
  if(busy){ctrl&&ctrl.abort();return}
  if(!text&&!pending.length)return;
  TTS.stop();
  if(!pending.length&&text.length<400&&/(चित्र|तस्वीर|फ़ोटो|फोटो|इमेज|लोगो|पोस्टर|image|picture|photo|logo|poster)/i.test(text)&&/(बना|draw|make|create|generate)/i.test(text)&&!/(कैसे|how to|क्या है|what is)/i.test(text)){
    toast('चित्र बनाने के लिए इमेज बनाना खुल रहा है…',2500);
    go('t_image',{prompt:text,auto:true});return;
  }
  const turn={id:uid(),role:'user',content:text||'(फ़ाइल देखकर बताइए)',ts:Date.now()};
  if(pending.length){turn.att=pending.map(a=>({name:a.name,kind:a.kind}));ATT[turn.id]=pending;pending=[]}
  cur.turns.push(turn);cur.updated=Date.now();
  await runAssistant();
}
const composerSend=()=>{
  const home=homeEl();const inp=$('#inp',home);const v=inp.value;
  if(busy){ctrl&&ctrl.abort();return}
  if(!v.trim()&&!pending.length)return;
  inp.value='';inp.style.height='auto';
  sendMessage(v);
};
function stopRecog(){if(recog){try{recog.stop()}catch(e){}recog=null}const h=homeEl();h&&$$('.mic-on',h).forEach(b=>b.classList.remove('mic-on'))}

}

let voiceOut=true;
SCREENS.voice={from:'bottom',cls:'voice',render(node){
  node.innerHTML=`
  <div class="v-top"><button class="ib sq" data-back aria-label="वापस">${ic('back',24)}</button><button class="ib sq" data-go="s_voice" aria-label="और विकल्प">${ic('dotsh',22)}</button></div>
  <div class="v-t"><div class="v-h" id="vh">बात शुरू करें</div><div class="v-s" id="vs">माइक अपने-आप चालू रहता है — बस बोलिए, या नीचे लिखिए</div></div>
  <div class="v-orb" data-act="vorb"><div class="orb-o big"><div class="orb" id="vorb"></div></div></div>
  <div class="v-st" id="vst">AI तैयार है</div>
  <div class="v-btns"><button class="cb" data-act="vmic" id="vmic" aria-label="माइक">${ic('mic',26)}</button><button class="cb" data-act="vspk" id="vspk" aria-label="आवाज़">${ic('volume',26)}</button><button class="cb red" data-act="vend" aria-label="बंद करें">${ic('close',26)}</button></div>
  <div class="v-in"><button class="cb sm" data-act="vplus" aria-label="जोड़ें">${ic('plus',22)}</button><div class="v-box"><input id="vtxt" placeholder="कुछ भी पूछें" aria-label="कुछ भी पूछें" autocomplete="off"><button class="send sm" data-act="vsend" aria-label="भेजें">${ic('send',20)}</button></div></div>`;
  const $h=$('#vh',node),$s=$('#vs',node),$st=$('#vst',node),orb=$('#vorb',node);
  const state=(k,h,s,st)=>{orb.className='orb '+k;if(h)$h.textContent=h;if(s!=null)$s.textContent=s;$st.textContent=st};
  let r=null,vrec=null,auto=true,empties=0,timer=null,alive=true;
  const IDLE=()=>state('','बात शुरू करें','माइक बंद है — दबाकर फिर चालू करें','AI तैयार है');
  const again=(ms=500)=>{clearTimeout(timer);if(!auto||!alive)return;timer=setTimeout(()=>{const t=topRec();if(auto&&alive&&!vrec&&!busy&&!TTS.on&&t&&t.node===node)startL()},ms)};
  const startL=()=>{
    if(vrec||!S.voice.stt)return;
    TTS.stop();$('#vmic',node).classList.add('on');state('listen','मैं सुन रहा हूँ','बोलिए, मैं आपकी बात सुन रहा हूँ…','सुन रहा हूँ');
    let last='',fin2=false;
    vrec=listen({
      onResult:(tx,fin)=>{last=tx;$s.textContent=tx;if(fin){fin2=true;empties=0;stopL();ask(tx)}},
      onEnd:()=>{if(!vrec)return;stopL();
        if(last&&!fin2){empties=0;ask(last);return}
        empties++;
        if(auto&&empties<5)again(400);else{auto=false;IDLE()}},
      onError:er=>{stopL();
        if(er==='not-allowed'||er==='unsupported'){auto=false;state('','टाइप करके पूछें',micErr(er),'AI तैयार है');toast(micErr(er),4500);return}
        empties++;
        if(auto&&empties<6){state('listen','मैं सुन रहा हूँ','माइक फिर चालू हो रहा है…','सुन रहा हूँ');again(1200)}
        else{auto=false;state('','माइक रुक गया',micErr(er),'AI तैयार है');toast(micErr(er),4500)}}
    });
    if(!vrec)$('#vmic',node).classList.remove('on');
  };
  const stopL=()=>{if(vrec){try{vrec.stop()}catch(e){}vrec=null}$('#vmic',node).classList.remove('on')};
  const ask=async text=>{
    text=text.trim();if(!text||busy)return;
    stopL();TTS.stop();
    const turn={id:uid(),role:'user',content:text,ts:Date.now(),voice:true};
    cur.turns.push(turn);cur.updated=Date.now();
    state('think','सोच रहा हूँ…','आपने कहा: '+text.slice(0,90),'जवाब बन रहा है');
    /* बहता बोलना: जवाब बनते-बनते पूरे वाक्य बोलना शुरू कर दो */
    let spoken=0,began=false;
    if(voiceOut){
      TTS.begin();
      voiceHook=txt=>{
        const rest=txt.slice(spoken);const re=/[\s\S]*?(?:[।!?.](?=\s)|\n)/g;let m,last=0;
        while((m=re.exec(rest))){
          last=re.lastIndex;
          if(TTS.add(m[0])&&!began){began=true;state('speak','मैं बोल रहा हूँ',txt.replace(/\s+/g,' ').slice(0,160),'सुनिए…')}
        }
        spoken+=last;
      };
    }
    const reply=await runAssistant({voice:true});
    voiceHook=null;
    const last=cur.turns[cur.turns.length-1];
    if(!reply||(last&&last.err)){TTS.stop();state('','कुछ गड़बड़ हुई',last&&last.content||'फिर कोशिश करें','AI तैयार है');again(2500);return}
    if(voiceOut){
      const tail=reply.slice(spoken);
      if(TTS.add(tail)&&!began){began=true;state('speak','मैं बोल रहा हूँ',reply.replace(/\s+/g,' ').slice(0,160),'सुनिए…')}
      if(!began){state('','जवाब तैयार है',reply.slice(0,160),'AI तैयार है');again(1200);return}
      state('speak','मैं बोल रहा हूँ',reply.replace(/\s+/g,' ').slice(0,160),'सुनिए…');
      TTS.finish(()=>{state('','बात जारी रखें','बोलिए, मैं सुन रहा हूँ','AI तैयार है');again(400)});
    }else{state('','जवाब तैयार है',reply.replace(/\s+/g,' ').slice(0,160),'आवाज़ बंद है');again(1500)}
  };
  wire(node,{act:{
    vmic:t=>{
      if(!S.voice.stt){toast('बोलकर लिखना बंद है। सेटिंग्स → आवाज़ में चालू करें।');return}
      if(auto){auto=false;clearTimeout(timer);stopL();IDLE();return}
      auto=true;empties=0;startL();
    },
    vspk:t=>{voiceOut=!voiceOut;t.innerHTML=ic(voiceOut?'volume':'mute',26);t.classList.toggle('off',!voiceOut);if(!voiceOut)TTS.stop();toast(voiceOut?'AI की आवाज़ चालू':'AI की आवाज़ बंद')},
    vend:()=>{auto=false;alive=false;voiceHook=null;clearTimeout(timer);TTS.stop();stopL();if(busy&&ctrl)ctrl.abort();back()},
    vorb:()=>{
      if(TTS.on){TTS.stop();state('','बात जारी रखें','बोलिए, मैं सुन रहा हूँ','AI तैयार है');auto=true;empties=0;again(150)}
      else if(!vrec&&!busy){auto=true;empties=0;startL()}
    },
    vplus:()=>openPlus(),
    vsend:()=>{const i=$('#vtxt',node);const v=i.value;i.value='';ask(v)}
  }});
  $('#vtxt',node).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const i=e.target;const v=i.value;i.value='';ask(v)}});
  r=null;
  node._vstop=()=>{auto=false;alive=false;clearTimeout(timer);stopL()};
  setTimeout(()=>{if(alive&&auto)startL()},800);
},onLeave(rec){voiceHook=null;TTS.stop();try{rec&&rec.node&&rec.node._vstop&&rec.node._vstop()}catch(e){}}};

function screenPaint(node,title,body,right=''){

async function fileToDataURL(file,max=900,q=.72){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}

  const draw=()=>screenPaint(node,'नोटिफिकेशन',`${intro('तय करें कि Apna AI से कौन-कौन से नोटिफिकेशन आएँ।')}
  ${card(`${sw('all','सभी नोटिफिकेशन','सभी ऐप नोटिफिकेशन चालू या बंद करें',S.notif.all)}${dv}
  <div class="${S.notif.all?'':'dimmed'}">
  ${ck('reply','AI जवाब','AI के जवाब से जुड़े नोटिफिकेशन',S.notif.reply)}
  ${ck('study','पढ़ाई की याद','पढ़ाई और अभ्यास की याद दिलाना',S.notif.study)}
  ${ck('update','ऐप अपडेट','नए फीचर्स और अपडेट की सूचना',S.notif.update)}
  ${ck('sound','नोटिफिकेशन की आवाज़','नोटिफिकेशन आने पर आवाज़',S.notif.sound)}
  ${ck('vibrate','कंपन','नोटिफिकेशन आने पर कंपन',S.notif.vibrate)}</div>`)}
  <p class="note pad0">ये सूचनाएँ ऐप खुला होने पर दिखती हैं (ऊपर का संदेश, आवाज़, कंपन और होम पर अभ्यास की याद)। फ़ोन बंद या ऐप बंद होने पर सूचना भेजने के लिए असली Android ऐप चाहिए।</p>
  <button class="btn ghost" data-act="test">${ic('bell',18)} टेस्ट नोटिफिकेशन</button>`);
  draw();
  wire(node,{
    act:{test:()=>{if(!S.notif.all){toast('पहले “सभी नोटिफिकेशन” चालू करें');return}if(S.notif.sound)beep();if(S.notif.vibrate&&navigator.vibrate)try{navigator.vibrate(80)}catch(e){}toast('यह एक टेस्ट नोटिफिकेशन है')}},
    chg:{all:t=>{S.notif.all=t.checked;save();draw()},reply:t=>{S.notif.reply=t.checked;save()},study:t=>{S.notif.study=t.checked;save()},update:t=>{S.notif.update=t.checked;save()},sound:t=>{S.notif.sound=t.checked;save()},vibrate:t=>{S.notif.vibrate=t.checked;save()}}
  });
}};

/* ================= आवाज़ ================= */
SCREENS.s_voice={render(node){
  const draw=()=>screenPaint(node,'आवाज़',`${intro('आवाज़ से बातचीत को यहाँ से नियंत्रित करें।')}
  ${card(`
    ${item({i:'mic',t:'बोलकर लिखना',d:'बोलकर मैसेज लिखवाना',badge:S.voice.stt?'चालू':'बंद',bk:S.voice.stt?1:0,act:'stt'})}
    ${item({i:'wave',t:'AI वॉइस बातचीत',d:'अलग फ़ुल-स्क्रीन पर लाइव बातचीत',badge:S.voice.mode?'चालू':'बंद',bk:S.voice.mode?1:0,act:'vmode'})}
    ${dv}<div class="padi">${rg('ve','AI की बोलने वाली आवाज़',[['phone','फ़ोन की आवाज़ (अभी वाली)'],['gemini','Gemini की आवाज़ (ज़्यादा प्राकृतिक, इंटरनेट चाहिए)']],S.voice.engine||'phone')}
      ${S.voice.engine==='gemini'?`<div class="sp12"></div>${rg('gv','Gemini की आवाज़ चुनें',[['Kore','Kore — दृढ़'],['Puck','Puck — ऊर्जावान'],['Sulafat','Sulafat — गर्म'],['Enceladus','Enceladus — धीमी साँस जैसी']],S.voice.gvoice||'Kore')}<p class="note pad0">मुफ़्त सीमा पूरी होने या नेट न चलने पर अपने-आप फ़ोन की आवाज़ पर लौट आती है।</p>`:''}
    </div>
    ${dv}<div class="padi">${rg('vl','आवाज़ की भाषा',[['hi','हिंदी'],['en','English'],['auto','अपने-आप पहचानें']],S.voice.lang)}</div>
    ${dv}<div class="padi"><div class="tt">AI की आवाज़ की गति</div>
      <div class="spd"><span>धीमी</span><b id="spv">${S.voice.speed.toFixed(1)}×</b><span>तेज़</span></div>
      <input type="range" class="rng" data-in="spd" min="0.5" max="2" step="0.1" value="${S.voice.speed}" aria-label="आवाज़ की गति">
      <div class="spd2"><span>0.5×</span><span>1×</span><span>2×</span></div>
      <button class="btn sm ghost" data-act="say">${ic('volume',16)} आवाज़ सुनें</button>
    </div>`)}
  <div id="vlist"></div>
  <p class="note pad0">बोलकर लिखने के लिए माइक की अनुमति चाहिए। Claude का यह व्यू माइक रोक सकता है; तब नीचे टाइप करके पूछें। AI की आवाज़ आपके फ़ोन या ब्राउज़र की आवाज़ों से चलती है।</p>`);
  draw();
  const voices=()=>{
    const box=$('#vlist',node);if(!box)return;
    const vs=TTS.voices().filter(v=>/^(hi|en)/i.test(v.lang));
    box.innerHTML=vs.length?card(`<div class="padi"><div class="lb">आवाज़ चुनें</div>${vs.slice(0,14).map(v=>`<button class="ro" data-act="vc" data-v="${esc(v.voiceURI)}" role="radio" aria-checked="${S.voice.voiceURI===v.voiceURI}"><span class="rd${S.voice.voiceURI===v.voiceURI?' on':''}"></span><span>${esc(v.name)} <small class="sub">${esc(v.lang)}</small></span></button>`).join('')}</div>`):'';
  };
  voices();try{speechSynthesis.onvoiceschanged=voices}catch(e){}
  wire(node,{
    act:{
      stt:()=>{S.voice.stt=!S.voice.stt;save();draw();voices()},
      vmode:()=>{S.voice.mode=!S.voice.mode;save();draw();voices()},
      rg:t=>{const k=t.dataset.k;if(k==='ve'){S.voice.engine=t.dataset.v;save();if(t.dataset.v==='gemini')CLOUD.unlock();draw();voices();return}if(k==='gv'){S.voice.gvoice=t.dataset.v;save();rgUpdate(t);return}S.voice.lang=t.dataset.v;save();rgUpdate(t)},
      say:()=>{const l=S.voice.lang==='en'?'en':'hi';TTS.say(l==='en'?'Hello! I am Apna AI. How can I help you today?':'नमस्ते! मैं आपका अपना AI हूँ। बताइए, आज मैं आपकी क्या मदद करूँ?',{lang:l})},
      vc:t=>{S.voice.voiceURI=t.dataset.v;save();voices()}
    },
    inp:{spd:t=>{S.voice.speed=+t.value;save();$('#spv',node).textContent=S.voice.speed.toFixed(1)+'×'}}
  });
}};

/* ================= AI मॉडल ================= */
SCREENS.s_model={render(node){
  const draw=()=>{
    const provs=Object.values(PROV).filter(p=>!(p.builtin&&!window.claude));
    screenPaint(node,'AI मॉडल',`${intro('चुनें कि AI कैसे जवाब दे और कौन-सा मॉडल इस्तेमाल करे।')}
    ${card(`<div class="padi">
      ${rg('tier','जवाब देने वाला मॉडल',[['auto','Auto — अपने-आप मॉडल चुनें'],['fast','Fast — जल्दी जवाब'],['smart','Smart — कठिन सवालों के लिए']],S.tier)}
      ${dv}${rg('style','जवाब का तरीका',[['short','Short — छोटा जवाब'],['balanced','Balanced — सामान्य जवाब'],['detailed','Detailed — विस्तार से']],S.style)}
      ${dv}<div class="tt pb">अन्य विकल्प</div>
      ${ck('srch','इंटरनेट खोज (ज़रूरत पड़ने पर अपने-आप)','ताज़ा खबर, कीमत, स्कोर और GK पर AI खुद खोजता है और जवाब के नीचे स्रोत-लिंक दिखाता है। चैट के 🌐 बटन से भी चालू/बंद होता है।',!!(S.search&&S.search.on))}
      ${ck('stav','  ↳ Tavily वेब-खोज','मुफ़्त: 1,000 खोज/महीना। चाबी Worker में है।',!!(S.search&&S.search.tavily))}
      ${ck('swik','  ↳ Wikipedia','मुफ़्त, चाबी नहीं चाहिए। GK, इतिहास, विज्ञान के लिए।',!!(S.search&&S.search.wiki))}
      ${ck('deep','कठिन सवालों पर अधिक सोच-विचार','गणित, तर्क और कोड के सवालों पर सबसे सक्षम मॉडल',S.deep)}
      ${ck('verify','जवाब को दोबारा जाँचना','हर लंबे जवाब को दूसरी बार जाँचा जाता है (समय और इस्तेमाल दोगुना)',S.verify)}
    </div>`)}
    ${lbl('कौन-सा AI इस्तेमाल हो')}
    ${card(provs.map(p=>`<div class="prow"><button class="ro grow" data-act="prov" data-v="${esc(p.id)}" role="radio" aria-checked="${S.provider===p.id}"><span class="rd${S.provider===p.id?' on':''}"></span><span class="tx"><span class="tt">${esc(p.label)}</span><span class="ds">${esc(p.desc)}</span></span></button>${p.custom?`<button class="mini" data-act="ptest" data-v="${esc(p.id)}" aria-label="कनेक्शन जाँचें">${ic('lightning',16)}</button><button class="mini" data-act="pdel" data-v="${esc(p.id)}" aria-label="हटाएँ">${ic('trash',16)}</button>`:`<span class="tag on">बिल्ट-इन</span>`}</div>`).join(''))}
    ${lbl('Groq (मुफ़्त सीमा, बहुत तेज़)')}
    ${card(`<div class="padi"><p class="note pad0">एक बटन में Groq के सभी 7 चैट मॉडल जुड़ जाएँगे: GPT OSS 120B/20B, Llama 3.3 70B, Llama 3.1 8B, Qwen 3.8 27B (फ़ोटो भी समझता है, एक बार में 3 तक), MiniMax M2.7 और Muse Spark। प्रीव्यू वाले मॉडल कभी बदल या बंद हो सकते हैं। Worker का वही APP_TOKEN अपने-आप इस्तेमाल होगा।</p><div class="sp12"></div><button class="btn" data-act="groqall">${ic('plus',18)} Groq के सभी मॉडल जोड़ें</button></div>`)}
    ${lbl('अपना मॉडल जोड़ें (OpenAI-जैसा API)')}
    ${card(`<div class="padi">
      ${field('cn','नाम',{ph:'जैसे: मेरा Qwen'})}${field('cu','Base URL',{ph:'https://मेरा-सर्वर.com/v1'})}${field('cm','मॉडल का नाम',{ph:'जैसे: qwen2.5-7b-instruct'})}${field('ck','API Key (ज़रूरत हो तो)',{type:'password',ph:'sk-…'})}${field('cim','इमेज बनाने वाला मॉडल (वैकल्पिक)',{ph:'जैसे: stable-diffusion-xl'})}${field('cim','इमेज-मॉडल का नाम (वैकल्पिक, चित्र बनाने के लिए)',{ph:'जैसे: sdxl'})}
      <div class="sp12"></div><button class="btn" data-act="padd">${ic('plus',18)} मॉडल जोड़ें</button>
    </div>`)}
    <p class="note pad0">Ollama, vLLM, LM Studio, OpenRouter, Groq जैसी कोई भी सेवा जो “/chat/completions” समझती है, यहाँ जुड़ सकती है। Key सिर्फ़ इसी ब्राउज़र में रहती है। ध्यान दें: Claude का यह व्यू बाहरी सर्वर के कनेक्शन रोक सकता है; तब “कनेक्शन जाँचें” में गड़बड़ी दिखेगी। ऐप को अपनी होस्टिंग या Android में चलाने पर यह सीमा नहीं रहती।</p>`);
  };
  draw();
  wire(node,{
    act:{
      rg:t=>{const k=t.dataset.k;if(k==='tier')S.tier=t.dataset.v;else S.style=t.dataset.v;save();rgUpdate(t)},
      groqall:()=>{
        const g=(S.customs||[]).find(c=>/\/(gemini|openai|groq)\/v1\/?$/i.test(c.url||''));
        if(!g){toast('पहले अपना Worker वाला मॉडल (Gemini) जुड़ा होना चाहिए',4000);return}
        const base=g.url.replace(/\/(gemini|openai|groq)\/v1\/?$/i,'/groq/v1');
        const L=[['Groq · GPT OSS 120B','openai/gpt-oss-120b',0],['Groq · GPT OSS 20B','openai/gpt-oss-20b',0],['Groq · Llama 3.3 70B','llama-3.3-70b-versatile',0],['Groq · Llama 3.1 8B (सबसे तेज़)','llama-3.1-8b-instant',0],['Groq · Qwen 3.8 27B (फ़ोटो भी, प्रीव्यू)','qwen/qwen3.8-27b',1],['Groq · MiniMax M2.7 (प्रीव्यू)','minimaxai/minimax-m2.7',0],['Groq · Muse Spark (प्रीव्यू)','meta-models/muse-spark-open',0]];
        let n=0;
        for(const [name,model,v] of L){
          if(S.customs.some(c=>c.url===base&&c.model===model))continue;
          S.customs.push({id:'c'+uid(),name,url:base,model,key:g.key||'',vision:!!v,maxImg:v?3:undefined});n++;
        }
        save();loadCustoms();draw();toast(n?n+' Groq मॉडल जुड़ गए — नीचे सूची में चुनें':'सभी Groq मॉडल पहले से जुड़े हैं',4000);
      },
      prov:t=>{S.provider=t.dataset.v;save();draw();toast('अब यह AI जवाब देगा: '+PROV[S.provider].label)},
      pdel:t=>{S.customs=S.customs.filter(c=>c.id!==t.dataset.v);save();loadCustoms();draw()},
      ptest:async t=>{
        const p=PROV[t.dataset.v];if(!p)return;toast('जाँच रहा हूँ…',1800);
        try{const r=await p.ask({prompt:'सिर्फ़ "ठीक" लिखो।',tier:'quick'});toast('कनेक्शन सही है: '+String(r.text).slice(0,30))}catch(e){toast(errMsg(e),5000)}
      },
      padd:()=>{
        const name=$('#cn',node).value.trim(),url=$('#cu',node).value.trim(),model=$('#cm',node).value.trim(),key=$('#ck',node).value.trim(),imgModel=$('#cim',node).value.trim();
        if(!name||!/^https?:\/\/\S+$/.test(url)||!model){toast('नाम, सही Base URL (http/https) और मॉडल का नाम भरें');return}
        const c={id:'c'+uid(),name,url,model,key,imgModel:$('#cim',node).value.trim()};
        S.customs.push(c);S.provider=c.id;save();loadCustoms();draw();toast('मॉडल जुड़ गया: '+name);
      }
    },
    chg:{srch:t=>{S.search.on=t.checked;save()},stav:t=>{S.search.tavily=t.checked;save()},swik:t=>{S.search.wiki=t.checked;save()},deep:t=>{S.deep=t.checked;save()},verify:t=>{S.verify=t.checked;save()}}
  });
}};

/* ================= डेटा नियंत्रण ================= */
function allChatsText(){return chats.filter(c=>c.turns.length).map(c=>'# '+c.title+'\n\n'+transcript(c)).join('\n\n———\n\n')}
SCREENS.s_data={render(node){
  const draw=()=>screenPaint(node,'डेटा नियंत्रण',`${intro('अपनी चैट और डेटा को यहाँ से मैनेज करें।')}${card([
    item({i:'chat',t:'चैट हिस्ट्री',d:'पुरानी बातचीत सेव रखना',badge:S.history?'चालू':'बंद',bk:S.history?1:0,act:'hist'}),
    item({i:'download',t:'चैट सेव करें',d:'अपनी चैट डाउनलोड करना',act:'export'}),
    item({i:'upload',t:'बैकअप से लौटाएँ',d:'पहले सेव की हुई JSON फ़ाइल से चैट जोड़ना',act:'import'}),
    item({i:'archive',t:'आर्काइव की गई चैट',d:'छिपाकर रखी गई चैट देखना',badge:String(chats.filter(c=>c.archived).length),go:'s_archived',chev:true}),
    item({i:'trash',t:'सभी चैट डिलीट करें',d:'सभी बातचीत हटाना',badge:'सावधानी',bk:2,act:'wipe',danger:true})
  ].join(''))}`);
  draw();node._draw=draw;
  wire(node,{act:{
    hist:()=>{S.history=!S.history;save();if(S.history)persist();else toast('अब नई चैट सेव नहीं होंगी (पुरानी रहेंगी)');draw()},
    export:()=>{
      if(!chats.length){toast('सेव करने के लिए अभी कोई चैट नहीं है');return}
      const sh=openSheet({title:'चैट सेव करें',html:`<div class="card flat">${item({i:'doc',t:'सब कुछ एक TXT में',d:'पढ़ने के लिए',act:'t'})}${item({i:'report',t:'PDF',d:'पढ़ने और भेजने के लिए',act:'p'})}${item({i:'code',t:'बैकअप (JSON)',d:'दूसरे डिवाइस पर लौटाने के लिए',act:'j'})}</div>`});
      sh.body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;sh.close();
        if(b.dataset.act==='t')saveFile('apna-ai-chats.txt',allChatsText());
        if(b.dataset.act==='p')exportText('pdf',allChatsText(),'Apna AI चैट');
        if(b.dataset.act==='j')saveFile('apna-ai-backup.json',JSON.stringify({v:1,chats},null,1))});
    },
    import:async()=>{
      const f=(await pickFiles({accept:'.json'}))[0];if(!f)return;
      try{const j=JSON.parse(await f.text());let n=0;(j.chats||[]).forEach(c=>{if(c&&c.id&&Array.isArray(c.turns)&&!chats.some(x=>x.id===c.id)){chats.push(c);n++}});persist();toast(n+' चैट जुड़ीं');draw()}
      catch(e){toast('यह बैकअप फ़ाइल पढ़ी नहीं जा सकी')}
    },
    wipe:()=>confirmSheet({title:'सभी चैट डिलीट करें?',msg:'आपकी सारी बातचीत (आर्काइव सहित) हमेशा के लिए हट जाएगी। पहले बैकअप चाहिए तो “चैट सेव करें” चुनें।',ok:'सब डिलीट करें',danger:true,onOk:()=>{chats=[];LS.del('apna.chats');newChat();draw();toast('सारी चैट हट गईं')}})
  }});
},onShow(rec){rec.node._draw&&rec.node._draw()}};
SCREENS.s_archived={render(node){
  const draw=()=>{
    const list=chats.filter(c=>c.archived);
    screenPaint(node,'आर्काइव की गई चैट',list.length?card(list.map(c=>`<div class="prow"><button class="it grow" data-act="open" data-id="${c.id}"><span class="ic">${ic('archive',20)}</span><span class="tx"><span class="tt">${esc(c.title)}</span><span class="ds">${c.turns.length} संदेश</span></span></button><button class="mini" data-act="unarc" data-id="${c.id}" aria-label="वापस लाएँ">${ic('redo',16)}</button></div>`).join('')):`<p class="note">अभी कोई चैट आर्काइव में नहीं है। चैट के 3-डॉट मेन्यू से “आर्काइव करें” चुनें।</p>`);

async function hashPin(p){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('apna:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'apna:'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}
}
function pinPad(host,{title,sub='',onDone}){
  let v='';
  host.innerHTML=`<div class="pin-t">${esc(title)}</div><div class="pin-s" id="pin-s">${esc(sub)}</div><div class="pin-d" id="pin-d">${'<i></i>'.repeat(4)}</div><div class="pin-k">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button data-k="x" aria-label="मिटाएँ">${ic('backspace',22)}</button></div>`;
  const dots=()=>$$('#pin-d i',host).forEach((d,i)=>d.classList.toggle('on',i<v.length));
  host.onclick=async e=>{
    const b=e.target.closest('[data-k]');if(!b)return;
    if(b.dataset.k==='x')v=v.slice(0,-1);else if(v.length<4)v+=b.dataset.k;
    dots();
    if(v.length===4){const pin=v;v='';await onDone(pin,{reset:m=>{$('#pin-s',host).textContent=m||'';$('#pin-d',host).classList.add('shake');setTimeout(()=>{const d=$('#pin-d',host);d&&d.classList.remove('shake');dots()},400)},msg:m=>{$('#pin-s',host).textContent=m}});dots()}
  };
}
function showLock(){
  if($('#lock'))return;
  const el=mk(`<div id="lock" role="dialog" aria-modal="true" aria-label="ऐप लॉक"><div class="orb-o"><div class="orb"></div></div><div id="lock-b"></div></div>`);
  $('#app').append(el);
  let fails=0,until=0;
  pinPad($('#lock-b',el),{title:'ऐप लॉक है',sub:'PIN डालें',onDone:async(pin,ui)=>{
    if(Date.now()<until){ui.reset('थोड़ी देर रुकें, फिर कोशिश करें');return}
    if((await hashPin(pin))===S.lock.hash){el.remove();return}
    fails++;if(fails>=5){until=Date.now()+30000;fails=0;ui.reset('5 बार गलत PIN — 30 सेकंड बाद कोशिश करें')}else ui.reset('गलत PIN ('+fails+'/5)');
  }});
}

function runner(btn,idle,busyHTML){
  let ctl=null;
  busyHTML=busyHTML||`${ic('stop',18)} रोकें`;
  return{
    get busy(){return !!ctl},
    async run(fn){
      if(ctl){ctl.abort();return null}
      ctl=new AbortController();btn.innerHTML=busyHTML;btn.classList.add('stop');
      try{return await fn(ctl.signal)}
      catch(e){if(!(e&&e.code==='cancelled'))toast(errMsg(e),5500);return null}
      finally{ctl=null;btn.innerHTML=idle;btn.classList.remove('stop')}
    }
  };
}

const numOf=v=>{const x=parseFloat(String(v==null?'':v).replace(/[,₹$%\s]/g,''));return isFinite(x)?x:null};
const isNumCol=ci=>{const vals=T.sheet.rows.map(r=>r[ci]).filter(v=>String(v==null?'':v).trim()!=='');return vals.length>0&&vals.filter(v=>numOf(v)!==null).length/vals.length>=.7};
const fmtNum=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
function rectify(){const X=T.sheet;const w=Math.max(X.cols.length,...X.rows.map(r=>r.length),1);while(X.cols.length<w)X.cols.push('कॉलम '+(X.cols.length+1));X.rows=X.rows.map(r=>{r=r.slice();while(r.length<w)r.push('');return r.map(c=>c==null?'':String(c))})}
function setSheetFromRows(rows,name){
  const X=T.sheet;rows=rows.filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length)return false;
  X.cols=rows[0].map((c,i)=>String(c||'').trim()||'कॉलम '+(i+1));X.rows=rows.slice(1).map(r=>r.map(c=>String(c==null?'':c)));
  if(name)X.name=name;X.sample=false;rectify();X.chart={type:'bar',label:0,vals:[]};
  const nc=X.cols.map((_,i)=>i).filter(i=>isNumCol(i));X.chart.vals=nc.filter(i=>i!==0).slice(0,2);if(!X.chart.vals.length&&nc.length)X.chart.vals=[nc[0]];
  return true;
}
const CHART_COLORS=['var(--accent)','#5EE0C8','#8B7CF6','#FF7A7A','#5AA9FF','#F2C94C'];
function drawChart(cv,{type,labels,series}){
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const colors=[col('--accent'),'#5EE0C8','#8B7CF6','#FF7A7A','#5AA9FF','#F2C94C'];
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||320,h=cv.clientHeight||260;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  c.fillStyle=col('--card')||'#141B30';c.fillRect(0,0,w,h);
  c.font='12px Hind,system-ui,sans-serif';c.textBaseline='middle';
  const txt=col('--sub2'),grid=col('--line');
  if(!labels.length||!series.length){c.fillStyle=txt;c.textAlign='center';c.fillText('चार्ट के लिए कॉलम चुनें',w/2,h/2);return}
  if(type==='pie'){
    const d=series[0].data.map(v=>Math.max(0,v||0)),tot=d.reduce((a,b)=>a+b,0)||1;
    const cx=w*.34,cy=h/2,r=Math.min(w*.3,h*.42);let a0=-Math.PI/2;
    d.forEach((v,i)=>{const a1=a0+v/tot*Math.PI*2;c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,a0,a1);c.closePath();c.fillStyle=colors[i%colors.length];c.fill();c.strokeStyle=col('--card');c.lineWidth=2;c.stroke();a0=a1});
    c.textAlign='left';labels.slice(0,10).forEach((l,i)=>{const y=22+i*20;c.fillStyle=colors[i%colors.length];c.fillRect(w*.64,y-6,12,12);c.fillStyle=col('--text');c.fillText(String(l).slice(0,12)+' · '+Math.round(d[i]/tot*100)+'%',w*.64+18,y)});
    return;
  }
  const pl=44,pr=12,pt=18,pb=34,iw=w-pl-pr,ih=h-pt-pb;
  const all=series.flatMap(s=>s.data.map(v=>v||0)),mx=Math.max(...all,1),mn=Math.min(0,...all);
  const nice=(()=>{const s=(mx-mn)/4,p=Math.pow(10,Math.floor(Math.log10(s||1)));const m=s/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p})();
  const top=Math.ceil(mx/nice)*nice,bot=Math.floor(mn/nice)*nice;
  const Y=v=>pt+ih-(v-bot)/(top-bot||1)*ih;
  c.textAlign='right';c.strokeStyle=grid;c.lineWidth=1;
  for(let v=bot;v<=top+1e-9;v+=nice){const y=Y(v);c.beginPath();c.moveTo(pl,y);c.lineTo(w-pr,y);c.stroke();c.fillStyle=txt;c.fillText(fmtNum(v),pl-6,y)}
  const n=labels.length,gw=iw/n;c.textAlign='center';
  labels.forEach((l,i)=>{if(n>12&&i%Math.ceil(n/12))return;c.fillStyle=txt;c.fillText(String(l).slice(0,8),pl+gw*(i+.5),h-pb+16)});
  if(type==='line'){
    series.forEach((s,si)=>{c.strokeStyle=colors[si%colors.length];c.lineWidth=2.4;c.beginPath();s.data.forEach((v,i)=>{const x=pl+gw*(i+.5),y=Y(v||0);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=colors[si%colors.length];s.data.forEach((v,i)=>{c.beginPath();c.arc(pl+gw*(i+.5),Y(v||0),3.2,0,7);c.fill()})});
  }else{
    const k=series.length,bw=Math.min(34,gw*.76/k);
    series.forEach((s,si)=>{c.fillStyle=colors[si%colors.length];s.data.forEach((v,i)=>{const x=pl+gw*(i+.5)-bw*k/2+si*bw,y=Y(Math.max(v||0,0)),y0=Y(0);c.fillRect(x+1,Math.min(y,y0),bw-2,Math.abs(y0-y)||1)})});
  }
  if(series.length>1){c.textAlign='left';series.forEach((s,i)=>{c.fillStyle=colors[i%colors.length];c.fillRect(pl+i*96,4,10,10);c.fillStyle=txt;c.fillText(String(s.name).slice(0,9),pl+i*96+14,9)})}
}
