    ${lbl('मान (Y-अक्ष) — चुनें')}<div class="chips">${nc.map(i=>`<button class="chip${ch.vals.includes(i)?' on':''}" data-act="cval" data-v="${i}">${esc(X.cols[i])}</button>`).join('')||'<span class="note">संख्या वाला कॉलम नहीं है</span>'}</div>
    <canvas id="cv" class="chart" aria-label="चार्ट"></canvas>
    <div class="row2"><button class="btn sm" data-act="cpng">${ic('download',16)} चार्ट की फ़ोटो (PNG)</button></div>`;
  };
  const drawTab=()=>{
    $('#xtabs',node).innerHTML=tabsHtml();
    const b=body();b.innerHTML=X.tab==='table'?tableTab():X.tab==='calc'?calcTab():chartTab();
    if(X.tab==='chart')paintChart();
    rnNew=$('#xnew',node)?runner($('#xnew',node),`${ic('sparkle',16)} नई शीट बनाएँ`):null;
    rnMod=$('#xmod',node)?runner($('#xmod',node),`${ic('wand',16)} इसी में बदलाव`):null;
    rnQ=$('#xqb',node)?runner($('#xqb',node),'पूछें','रोकें'):null;
  };
  let rnNew,rnMod,rnQ;
  const paintChart=()=>{
    const ch=X.chart,cv=$('#cv',node);if(!cv)return;
    const vals=ch.vals.filter(i=>i<X.cols.length);
    const rows=X.rows.slice(0,60);
    drawChart(cv,{type:ch.type,labels:rows.map(r=>r[ch.label]),series:vals.map(i=>({name:X.cols[i],data:rows.map(r=>numOf(r[i]))}))});
  };
  toolBody(node,'Excel / CSV',`<div id="xtabs"></div><div id="xbody"></div><div class="cta-pad"></div>`,`<button class="mini txt" data-act="xdl">${ic('download',16)} डाउनलोड</button>`);
  drawTab();
  const fromAI=async(modify)=>{
    const q=$('#xprompt',node).value.trim();
    if(!q){toast(modify?'बदलाव का निर्देश लिखें':'पहले लिखें कि कौन-सी टेबल चाहिए');return}
    const r=modify?rnMod:rnNew;
    const res=await r.run(sig=>aiJSON({prompt:`${modify?'नीचे दी टेबल में निर्देश के हिसाब से बदलाव करो और पूरी नई टेबल लौटाओ।\nनिर्देश: '+q+'\n\nमौजूदा टेबल (JSON):\n'+JSON.stringify({cols:X.cols,rows:X.rows.slice(0,300)}):'यूज़र के वर्णन के हिसाब से टेबल बनाओ।\nवर्णन: '+q}\n\nसिर्फ़ यह JSON लौटाओ: {"name":"शीट का नाम","cols":["कॉलम",...],"rows":[["मान",...],...]}\nनियम: हर मान स्ट्रिंग हो; संख्याओं में सिर्फ़ अंक और दशमलव (कोई ₹, कॉमा या इकाई नहीं); सभी पंक्तियों में कॉलम जितने ही मान; ज़्यादा से ज़्यादा 60 पंक्तियाँ। नाम और उदाहरण ${S.lang==='en'?'English':'हिंदी'} में।`,system:'तुम एक सटीक स्प्रेडशीट सहायक हो।',tier:'default',signal:sig,kind:'tool'}));
    if(res&&Array.isArray(res.cols)&&Array.isArray(res.rows)){
      setSheetFromRows([res.cols,...res.rows],res.name);X.tab='table';X.sheets=null;drawTab();toast('टेबल तैयार: '+X.rows.length+' पंक्तियाँ');
    }else if(res)toast('AI से सही टेबल नहीं मिली, फिर कोशिश करें');
  };
  const upload=async()=>{
    const f=(await pickFiles({accept:'.xlsx,.xls,.xlsm,.csv,.tsv'}))[0];if(!f)return;
    toast('फ़ाइल पढ़ रहा हूँ…');
    try{
      const r=await readFileAny(f);if(r.kind!=='table')throw 0;
      X.sheets=r.sheets.map((s,i)=>({name:s.name,rows:s.rows,sel:i===0}));
      setSheetFromRows(r.sheets[0].rows,f.name.replace(/\.\w+$/,''));X.tab='table';drawTab();toast('फ़ाइल खुल गई: '+X.rows.length+' पंक्तियाँ');
    }catch(e){toast('यह फ़ाइल पढ़ी नहीं जा सकी (XLSX या CSV चुनें)')}
  };
  const download=()=>{
    rectify();
    const sh=openSheet({title:'डाउनलोड',html:`<div class="card flat">${item({i:'grid',t:'Excel (XLSX)',d:'Excel और Sheets में खुलेगी',act:'x'})}${item({i:'doc',t:'CSV',d:'सादा टेबल फ़ाइल',act:'c'})}</div>`});
    sh.body.addEventListener('click',async e=>{
      const b=e.target.closest('[data-act]');if(!b)return;sh.close();
      const rows=[X.cols,...X.rows],nm=safeName(X.name||'sheet');
      if(b.dataset.act==='c')saveFile(nm+'.csv',csvEnc(rows));
      else{try{toast('XLSX बन रही है…');saveFile(nm+'.xlsx',await makeXlsx(rows,X.name))}catch(err){toast('XLSX बनाने वाली लाइब्रेरी नहीं खुली। CSV सेव करें।',4500)}}
    });
  };
  wire(node,{
    act:{
      xtab:t=>{X.tab=t.dataset.v;drawTab()},
      xnew:()=>fromAI(false),xmod:()=>fromAI(true),xup:upload,xdl:download,
      xrow:()=>{rectify();X.rows.push(X.cols.map(()=>''));X.sample=false;drawTab()},
      xcol:()=>{rectify();X.cols.push('कॉलम '+(X.cols.length+1));X.rows.forEach(r=>r.push(''));X.sample=false;drawTab()},
      xdrow:()=>{if(X.rows.length){X.rows.pop();drawTab()}},
      xdcol:()=>{if(X.cols.length>1){X.cols.pop();X.rows.forEach(r=>r.pop());drawTab()}},
      xtot:()=>{rectify();const r=X.cols.map((c,i)=>i===0?'कुल':isNumCol(i)?fmtNum(X.rows.reduce((a,x)=>a+(numOf(x[i])||0),0)):'');X.rows.push(r);drawTab()},
      xavg:()=>{rectify();const r=X.cols.map((c,i)=>{if(i===0)return 'औसत';if(!isNumCol(i))return '';const v=X.rows.map(x=>numOf(x[i])).filter(x=>x!==null);return fmtNum(v.reduce((a,b)=>a+b,0)/(v.length||1))});X.rows.push(r);drawTab()},
      xcalc:()=>{
        rectify();const a=+$('#ca',node).value,b=+$('#cb',node).value,o=$('#co',node).value,nm=$('#cn',node).value.trim()||'नया कॉलम';
        X.cols.push(nm);
        X.rows.forEach(r=>{
          const x=numOf(r[a]),y=numOf(r[b]);let v='';
          if(o==='sum'){const lo=Math.min(a,b),hi=Math.max(a,b);let s=0,ok=false;for(let i=lo;i<=hi;i++){const n=numOf(r[i]);if(n!==null){s+=n;ok=true}}v=ok?fmtNum(s):''}
          else if(x!==null&&y!==null){v=o==='+'?x+y:o==='-'?x-y:o==='*'?x*y:o==='/'?(y?x/y:''):o==='%'?(y?x/y*100:''):'';v=v===''?'':fmtNum(v)}
          r.push(v);
        });
        X.sample=false;drawTab();toast('नया कॉलम जुड़ गया');
      },
      xask:async()=>{
        const q=$('#xq',node).value.trim();if(!q){toast('सवाल लिखें');return}
        const out=$('#xans',node);out.hidden=false;const m=$('.md',out);m.innerHTML=THINK;rectify();
        const csv=[X.cols,...X.rows.slice(0,300)].map(r=>r.join(' | ')).join('\n');
        const res=await rnQ.run(sig=>ai({prompt:`नीचे एक टेबल है (पंक्तियाँ ' | ' से अलग)। सिर्फ़ इसी डेटा के आधार पर सवाल का जवाब दो। गणना ध्यान से करो और ज़रूरत हो तो स्टेप दिखाओ।${X.rows.length>300?' (टेबल की पहली 300 पंक्तियाँ ही दी गई हैं)':''}\n\nटेबल:\n${csv}\n\nसवाल: ${q}`,system:sysPrompt(),tier:'default',signal:sig,kind:'tool',onText:t=>{m.innerHTML=md(t)}}));
        if(res)m.innerHTML=md(res.text);else if(!m.textContent.trim()||m.querySelector('.dots'))out.hidden=true;
      },
      ctype:t=>{X.chart.type=t.dataset.v;segSet(t.parentNode,t);paintChart()},
      cval:t=>{const i=+t.dataset.v,v=X.chart.vals,k=v.indexOf(i);if(k>=0)v.splice(k,1);else v.push(i);t.classList.toggle('on',k<0);paintChart()},
      cpng:()=>{const cv=$('#cv',node);cv.toBlob(b=>b?saveFile(safeName(X.name)+'-चार्ट.png',b):toast('चार्ट की फ़ोटो नहीं बन सकी'),'image/png')}
    },
    inp:{},
    chg:{clab:t=>{X.chart.label=+t.value;paintChart()},xsel:t=>{const s=X.sheets[+t.value];X.sheets.forEach((x,i)=>x.sel=i===+t.value);setSheetFromRows(s.rows,s.name);drawTab()}}
  });
  node.addEventListener('input',e=>{
    const g=e.target.closest('.gi');if(!g)return;
    const r=+g.dataset.r,c=+g.dataset.c;
    if(r<0)X.cols[c]=g.value;else X.rows[r][c]=g.value;
    X.sample=false;
  });
  if(p.mode==='upload')setTimeout(upload,60);
  if(p.mode==='download')setTimeout(download,120);
  if(p.prompt)setTimeout(()=>{const e=$('#xprompt',node);if(e)e.value=p.prompt},0);
}};

const CODE_LANGS=[['python','Python','py'],['javascript','JavaScript','js'],['typescript','TypeScript','ts'],['java','Java','java'],['kotlin','Kotlin','kt'],['c','C','c'],['cpp','C++','cpp'],['csharp','C#','cs'],['go','Go','go'],['php','PHP','php'],['sql','SQL','sql'],['html','HTML/CSS/JS','html'],['bash','Bash','sh'],['swift','Swift','swift'],['dart','Dart','dart']];
T.code={mode:'gen',lang:'python',input:'',err:'',out:'',files:null,notes:'',view:'code'};
function firstCode(text){const m=String(text||'').match(/```[\w+#.-]*\n([\s\S]*?)```/);return m?m[1]:''}
SCREENS.t_code={render(node,p){
  const C=T.code;

  const draw=()=>{

    const ph={gen:'जैसे: किसी संख्या का फ़ैक्टोरियल निकालने का फ़ंक्शन',explain:'जो कोड समझना है',fix:'जिस कोड में गलती है',site:'जैसे: एक साधारण कैलकुलेटर वेब ऐप, गहरे रंग की थीम में'}[C.mode];

    ${C.mode!=='site'?`${lbl('भाषा')}<select class="fld" id="clang" aria-label="भाषा">${CODE_LANGS.map(l=>`<option value="${l[0]}"${l[0]===C.lang?' selected':''}>${l[1]}</option>`).join('')}</select>`:''}
    ${field('cin',lab,{ta:true,rows:C.mode==='gen'||C.mode==='site'?4:8,ph,val:C.input,cls:C.mode==='gen'||C.mode==='site'?'':'mono'})}
    ${C.mode==='fix'?field('cerr','एरर / समस्या (वैकल्पिक)',{ta:true,rows:3,ph:'जो एरर दिख रहा है, या क्या गलत चल रहा है',val:C.err,cls:'mono'}):''}
    <button class="btn" id="cgo" data-act="cgo">${ic(C.mode==='site'?'phone':'code',18)} ${{gen:'कोड बनाएँ',explain:'समझाएँ',fix:'गलती ठीक करें',site:'प्रोजेक्ट बनाएँ'}[C.mode]}</button>
    <div id="cres"${C.out||C.files?'':' hidden'}>${resHTML()}</div>`);
    rn=runner($('#cgo',node),$('#cgo',node).innerHTML);
  };
  const resHTML=()=>{
    if(C.mode==='site'&&C.files){
      const idx=C.files.find(f=>/index\.html?$/i.test(f.path));
      return `${C.notes?`<div class="card"><div class="padi md">${md(C.notes)}</div></div>`:''}
      ${segHtml([['code','फ़ाइलें'],['prev','प्रीव्यू']],C.view,'cview')}
      ${C.view==='prev'&&idx?`<iframe class="prevf" id="pf" sandbox="allow-scripts" title="प्रीव्यू"></iframe><p class="note">प्रीव्यू सुरक्षित बॉक्स में चलता है; कुछ चीज़ें (जैसे बाहरी लिंक) यहाँ न दिखें।</p>`:C.files.map(f=>`<div class="fbox">${lbl(f.path)}${codeBox(f.path.split('.').pop(),f.content)}</div>`).join('')}
      <div class="row2"><button class="btn sm" data-act="czip">${ic('download',16)} प्रोजेक्ट डाउनलोड (ZIP)</button></div>`;
    }
    const code=firstCode(C.out);const l=CODE_LANGS.find(x=>x[0]===C.lang);
    const isHtml=/<html|<!doctype/i.test(code);
    return `<div class="card"><div class="padi md">${md(C.out)}</div></div>
    <div class="row2"><button class="btn sm" data-act="ccopy">${ic('copy',16)} पूरा जवाब कॉपी</button>${code?`<button class="btn sm ghost" data-act="cfile">${ic('download',16)} कोड फ़ाइल सेव</button>`:''}${isHtml?`<button class="btn sm ghost" data-act="cprev">${ic('eye',16)} प्रीव्यू</button>`:''}</div>${l&&code?'':''}<div id="cpv"></div>`;
  };
  const setPreview=()=>{const idx=C.files&&C.files.find(f=>/index\.html?$/i.test(f.path));const f=$('#pf',node);if(f&&idx){let h=idx.content;C.files.forEach(x=>{if(x!==idx&&/\.css$/i.test(x.path))h=h.replace(new RegExp('<link[^>]+'+x.path.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^>]*>','i'),'<style>'+x.content+'</style>');if(x!==idx&&/\.js$/i.test(x.path))h=h.replace(new RegExp('<script[^>]+'+x.path.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^>]*><\/script>','i'),'<script>'+x.content.replace(/<\/script/gi,'<\\/script')+'<\/script>')});f.srcdoc=h}};
  draw();if(C.files&&C.view==='prev')setPreview();

          else{res.innerHTML=r?'<p class="err">प्रोजेक्ट सही रूप में नहीं बन सका, फिर कोशिश करें।</p>':'';if(!r)res.hidden=true}
          return;
        }
        C.files=null;
        const pr={gen:`${L} में यह काम करने वाला कोड लिखो: ${C.input}\n\nपहले पूरा चलने वाला कोड एक कोड-ब्लॉक में दो। फिर 3-5 बुलेट में हिंदी में बताओ कि कोड कैसे काम करता है और कैसे चलाना है। ज़रूरी जगह कमेंट डालो।`,

          fix:`नीचे का ${L} कोड गलत है या एरर दे रहा है। गलती ढूँढो, ठीक किया हुआ पूरा कोड एक कोड-ब्लॉक में दो, और फिर बुलेट में हिंदी में बताओ कि क्या गलत था और क्या बदला।\n\nकोड:\n\`\`\`${C.lang}\n${C.input}\n\`\`\`\n${C.err?'\nएरर/समस्या:\n'+C.err:''}`}[C.mode];
        const r=await rn.run(sig=>ai({prompt:pr,system:sysPrompt(),tier:'default',signal:sig,kind:'tool',onText:t=>{C.out=t;res.innerHTML=`<div class="card"><div class="padi md">${md(t)}</div></div>`}}));
        if(r){C.out=r.text;res.innerHTML=resHTML()}

      czip:async()=>{try{toast('ZIP बन रही है…');saveFile('project.zip',await makeZip(C.files))}catch(e){toast('ZIP बनाने वाली लाइब्रेरी नहीं खुली')}}
    },
    chg:{clang:t=>{C.lang=t.value}}
  });

T.res={mode:'research',q:'',depth:5,prog:[],report:'',compare:'',sources:''};
SCREENS.t_research={render(node,p){

async function shrinkImage(file,max=1600,q=.86){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
}
const BCP={hi:'hi-IN',en:'en-IN',ur:'ur-PK',bn:'bn-IN',mr:'mr-IN',gu:'gu-IN',pa:'pa-IN',ta:'ta-IN',te:'te-IN',kn:'kn-IN',ml:'ml-IN',sa:'hi-IN',ne:'ne-NP',fr:'fr-FR',es:'es-ES',de:'de-DE',ar:'ar-SA',ja:'ja-JP',zh:'zh-CN'};
function sayLang(text,code,onend){
  if(!('speechSynthesis' in window)){toast('इस ब्राउज़र में बोलने की सुविधा नहीं है');return false}
  const plain=stripMd(text);if(!plain)return false;
  TTS.stop();
  const lg=BCP[code]||'en-IN',short=lg.slice(0,2);
  const vs=TTS.voices();
  const v=vs.find(x=>x.lang&&x.lang.toLowerCase()===lg.toLowerCase())||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(short));
  if(!v&&vs.length&&code!=='hi'&&code!=='en'){toast('इस भाषा की आवाज़ इस डिवाइस में नहीं मिली')}
  const parts=plain.match(/[^।.!?\n]+[।.!?]*/g)||[plain];const segs=[];let c='';
  parts.forEach(p=>{if((c+p).length>170){if(c)segs.push(c);c=p}else c+=p});if(c)segs.push(c);
  segs.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s.trim());u.lang=lg;u.rate=S.voice.speed||1;if(v)u.voice=v;
    if(i===segs.length-1){u.onend=()=>onend&&onend();}
    u.onerror=()=>onend&&onend();
    try{speechSynthesis.speak(u)}catch(e){}
  });
  S.usage.tts++;save();return true;
}

function bumpStudy(subject,total,correct,topic){
  const st=S.study;const s=st.stats[subject]||(st.stats[subject]={a:0,c:0});s.a+=total;s.c+=correct;
  const today=dayKey(),y=new Date();y.setDate(y.getDate()-1);
  if(st.last!==today){st.streak=(st.last===dayKey(y))?(st.streak||0)+1:1}
  st.last=today;st.log.push({t:Date.now(),s:subject,topic:topic||'',n:total,c:correct});if(st.log.length>40)st.log.shift();save();
}

    ${log.length?lbl('हाल के सेशन')+card(log.map(l=>`<div class="padi"><div class="tt sm">${esc(l.s)}${l.topic?' · '+esc(l.topic):''}</div><div class="ds">${new Date(l.t).toLocaleDateString('hi-IN',{day:'numeric',month:'short'})} · ${l.c}/${l.n} सही</div></div>`).join(dv)):''}

  };

    return `<div class="card"><div class="padi">${hs.map((x,k)=>k<Y.hshow?`<div class="hintb">${ic('bulb',16)} <span><b>संकेत ${k+1}:</b> ${esc(x)}</span></div>`:'').join('')}
    <div class="row2">${Y.hshow<hs.length?`<button class="btn sm" data-act="smore">${Y.hshow?'अगला संकेत':'पहला संकेत'}</button>`:''}${Y.hshow>=hs.length?`<button class="btn sm ghost" data-act="ssol">${ic('eye',16)} पूरा हल देखें</button>`:''}</div>
    ${Y.hshow>=hs.length&&h.shortcut?`<div class="hintb">${ic('lightning',16)} <span><b>शॉर्टकट:</b> ${esc(h.shortcut)}</span></div>`:''}
    <div id="ssolv" hidden class="md">${md(h.solution||'')}</div></div></div>`;
  };
  const draw=()=>{
    toolBody(node,'स्टडी मोड',head()+body());
    const g=$('#sgo',node);rn=g?runner(g,g.innerHTML):null;
  };
  draw();
  const sync=()=>{const l=$('#slev',node);if(l)Y.level=l.value;const t=$('#stopic',node);if(t)Y.topic=t.value.trim();const c=$('#scq',node);if(c)Y.cq=c.value;const a=$('#sca',node);if(a)Y.ca=a.value;const h=$('#shq',node);if(h)Y.hq=h.value};
  const sys=sysPrompt({extra:'तुम अनुभवी शिक्षक हो। सटीक रहो; पक्का न हो तो साफ़ कहो।'});
  const finish=()=>{
    const c=Y.res.filter(x=>x).length;Y.state='done';bumpStudy(Y.subject,Y.qs.length,c,Y.topic);draw();
  };
  const startQs=qs=>{Y.qs=qs;Y.i=0;Y.sel=null;Y.res=[];Y.hint=false;Y.state='play';draw()};
  wire(node,{
    act:{

      scnt:t=>{Y.count=+t.dataset.v;chipSet(t.parentNode,t)},
      sgo:async()=>{
        sync();
        const r=await rn.run(async sig=>{
          const qs=await aiJSON({prompt:`${Y.level} स्तर के लिए “${Y.subject}”${Y.topic?' (विषय: '+Y.topic+')':''} के ${Y.count} बहुविकल्पीय प्रश्न बनाओ।\nनियम: हर प्रश्न का सिर्फ़ एक सही उत्तर; ठीक 4 विकल्प; अस्पष्ट या विवादित प्रश्न नहीं; ताज़ा घटनाओं के प्रश्न नहीं; गणना वाले प्रश्न में पहले खुद हल करके उत्तर तय करो; कठिनाई मिली-जुली।\nसिर्फ़ यह JSON array लौटाओ: [{"q":"प्रश्न","options":["..","..","..",".."],"answer":0,"hint":"उत्तर बताए बिना एक छोटा संकेत","explain":"स्टेप-बाय-स्टेप कारण, संक्षेप में"}]  (answer = सही विकल्प का index 0 से 3)`,system:sys,tier:'default',signal:sig,kind:'tool'});
          let list=(Array.isArray(qs)?qs:(qs&&qs.questions)||[]).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);
          if(!list.length)throw {message:'सवाल सही रूप में नहीं बने, फिर कोशिश करें'};
          Y.flagged=0;
          if(Y.vfy||S.verify){
            try{
              const chk=await aiJSON({prompt:`नीचे बहुविकल्पीय प्रश्न हैं। हर प्रश्न को खुद स्वतंत्र रूप से हल करके बताओ कि सही विकल्प कौन-सा है।\nसिर्फ़ JSON array of integers (0 से 3) लौटाओ, प्रश्नों के क्रम में, कुल ${list.length} संख्याएँ।\n\n`+list.map((q,k)=>`${k+1}. ${q.q}\n${q.options.map((o,j)=>'  '+'ABCD'[j]+') '+o).join('\n')}`).join('\n\n'),system:sys,tier:'complex',effort:'high',signal:sig,kind:'tool'});
              if(Array.isArray(chk))list.forEach((q,k)=>{if(Number.isInteger(chk[k])&&chk[k]!==q.answer){q.flag=true;Y.flagged++}});
            }catch(e){if(e&&e.code==='cancelled')throw e}
          }
          return list;
        });
        if(r){markStudy();startQs(r);if(Y.flagged)toast(Y.flagged+' सवाल पर दूसरी जाँच में फ़र्क मिला — उन पर चेतावनी दिखेगी',4500)}
      },
      shint:()=>{Y.hint=true;draw()},
      spick:t=>{if(Y.sel!=null)return;const k=+t.dataset.k;Y.sel=k;Y.res[Y.i]=(k===Y.qs[Y.i].answer);draw()},
      snext:()=>{if(Y.i+1<Y.qs.length){Y.i++;Y.sel=null;Y.hint=false;draw();node.querySelector('.scroll').scrollTop=0}else finish()},
      sask:()=>{const q=Y.qs[Y.i];askInChat(`इस सवाल को और विस्तार से समझाओ:\n${q.q}\n${q.options.map((o,j)=>'ABCD'[j]+') '+o).join('\n')}\nसही उत्तर: ${'ABCD'[q.answer]}`)},
      sagain:()=>{Y.state='setup';draw()},
      swrong:()=>{const w=Y.qs.filter((q,k)=>!Y.res[k]);if(w.length)startQs(w)},
      sweak:t=>{Y.subject=t.dataset.v;Y.mode='practice';Y.state='setup';draw()},
      sreset:()=>confirmSheet({title:'प्रगति रीसेट करें?',msg:'अभ्यास की सारी गिनती और स्ट्रीक हट जाएगी।',ok:'रीसेट करें',danger:true,onOk:()=>{S.study={stats:{},last:'',streak:0,log:[]};save();draw()}}),
      slearn:async()=>{
        sync();$('#sres',node).hidden=false;const m=$('#smd',node);m.innerHTML=THINK;
        const r=await rn.run(sig=>ai({prompt:`${Y.level} के विद्यार्थी के लिए “${Y.subject}”${Y.topic?' का टॉपिक: '+Y.topic:' का कोई ज़रूरी टॉपिक चुनकर'} आसान भाषा में सिखाओ।\nढाँचा: ## सरल परिचय, ## मुख्य बातें (बुलेट), ## हल किया हुआ उदाहरण (स्टेप-बाय-स्टेप), ## याद रखने की ट्रिक, ## 3 अभ्यास प्रश्न (अंत में उत्तर)।\nतथ्य या सूत्र पक्का न हो तो मत गढ़ो।`,system:sys,tier:'default',signal:sig,kind:'tool',onText:t=>{m.innerHTML=md(t)}}));
        if(r){Y.learn=r.text;m.innerHTML=md(r.text);markStudy()}else if(!Y.learn)$('#sres',node).hidden=true;
      },
      scopy:()=>copyText(Y.learn),sexp:()=>exportSheet(Y.learn,(Y.topic||Y.subject)+' नोट्स'),
      sprac:()=>{sync();Y.mode='practice';Y.state='setup';draw()},
      scheck:async()=>{
        sync();if(!Y.cq.trim()||!Y.ca.trim()){toast('सवाल और अपना जवाब दोनों लिखें');return}
        $('#sres',node).hidden=false;const m=$('#smd',node);m.innerHTML=THINK;
        const r=await rn.run(sig=>ai({prompt:`पहले इस सवाल को खुद स्वतंत्र रूप से स्टेप-बाय-स्टेप हल करो, फिर विद्यार्थी के जवाब से मिलाओ।\nजवाब की पहली लाइन सिर्फ़ यह हो: **नतीजा: सही ✅** या **नतीजा: गलत ❌** या **नतीजा: आंशिक सही ⚠️**\nफिर: ## सही हल (स्टेप), ## आपके जवाब में क्या ठीक/गलत था, ## अगली बार ध्यान रखें।\n\nसवाल:\n${Y.cq}\n\nविद्यार्थी का जवाब:\n${Y.ca}`,system:sys,tier:'complex',effort:'high',signal:sig,kind:'tool',onText:t=>{m.innerHTML=md(t)}}));
        if(r){Y.cres=r.text;m.innerHTML=md(r.text);markStudy()}else if(!Y.cres)$('#sres',node).hidden=true;
      },
      shints:async()=>{
        sync();if(!Y.hq.trim()){toast('पहले सवाल लिखें');return}
        const r=await rn.run(sig=>aiJSON({prompt:`सवाल/टॉपिक: ${Y.hq}\n\nविद्यार्थी को सोचने में मदद करो। सिर्फ़ JSON लौटाओ: {"hints":["संकेत 1 (हल्का)","संकेत 2 (थोड़ा साफ़)","संकेत 3 (लगभग रास्ता, पर उत्तर नहीं)"],"shortcut":"अगर कोई तेज़ तरीका/ट्रिक है तो एक-दो वाक्य में, वरना खाली","solution":"पूरा हल स्टेप-बाय-स्टेप, अंत में उत्तर"}\nहल पहले खुद सही-सही निकालो।`,system:sys,tier:'complex',signal:sig,kind:'tool'}));
        if(r&&r.hints){Y.hh=r;Y.hshow=0;$('#sres',node).innerHTML=hintsHTML();markStudy()}
      },
      smore:()=>{Y.hshow++;$('#sres',node).innerHTML=hintsHTML()},
      ssol:()=>{const s=$('#ssolv',node);s.hidden=!s.hidden}
    },
    chg:{svfy:t=>{Y.vfy=t.checked},slev:t=>{Y.level=t.value}},
    inp:{stopic:t=>{Y.topic=t.value.trim()},scq:t=>{Y.cq=t.value},sca:t=>{Y.ca=t.value},shq:t=>{Y.hq=t.value}}
  });
},onShow(rec){}};

      tgoimg:async()=>{
        if(!R.blob)return;$('#tres',node).hidden=false;const o=$('#tout',node);o.innerHTML=THINK;
        const r=await rn.run(sig=>ai({prompt:`इस फ़ोटो में जो भी लिखा है उसे पढ़ो और ${langEn[R.to]} (${langName(R.to)}) में अनुवाद करो।\nफ़ॉर्मेट:\n**मूल टेक्स्ट:**\n(जैसा लिखा है वैसा)\n\n**अनुवाद:**\n(अनुवाद)\nअगर पढ़ने लायक टेक्स्ट नहीं है तो साफ़ बताओ। कुछ गढ़ो मत।`,images:[R.blob],system:'तुम सटीक अनुवादक हो।',tier:'default',signal:sig,kind:'tool',onText:t=>{o.innerHTML=md(t)}}));
        if(r){R.out=r.text;o.innerHTML=md(r.text)}else if(!R.out)$('#tres',node).hidden=true;
      },
      tdoc:async()=>{
        const f=(await pickFiles({accept:'.txt,.md,.csv,.docx,.pdf,.xlsx,.html'}))[0];if(!f)return;
        toast('फ़ाइल पढ़ रहा हूँ…');
        try{const r=await readFileAny(f);if(r.kind==='image'){toast('फ़ोटो के लिए “फ़ोटो” टैब इस्तेमाल करें');return}R.docName=f.name;R.docText=(r.text||'').slice(0,60000);R.docOut='';draw()}
        catch(e){toast((e&&e.code&&e.message)||'यह फ़ाइल पढ़ी नहीं जा सकी')}
      },
      tgodoc:async()=>{
        const paras=R.docText.split(/\n{1,}/);const chunks=[];let c='';
        paras.forEach(pp=>{if((c+'\n'+pp).length>2600&&c){chunks.push(c);c=pp}else c=c?c+'\n'+pp:pp});if(c)chunks.push(c);
        const out=new Array(chunks.length).fill(null);const prog=$('#tprog',node);$('#tres',node).hidden=false;
        const upd=()=>{const n=out.filter(x=>x!=null).length;prog.innerHTML=`<div class="ps ${n===chunks.length?'done':'run'}"><span class="pdot"></span><span>${n} / ${chunks.length} हिस्से हो गए</span></div>`;const ta=$('#tdout',node);ta.value=out.filter(x=>x!=null).join('\n\n');R.docOut=ta.value};
        const r=await rn.run(async sig=>{let nx=0;const w=async()=>{while(nx<chunks.length){const i=nx++;const a=await ai({prompt:instr()+'\n\nटेक्स्ट:\n'+chunks[i],system:'तुम सटीक अनुवादक हो।',tier:'default',signal:sig,kind:'tool'});out[i]=a.text.trim();upd()}};await Promise.all([w(),w(),w()]);return true});
        if(!r)upd();
      },
      tdcopy:()=>copyText($('#tdout',node).value),
      tdexp:()=>exportSheet($('#tdout',node).value,(R.docName||'अनुवाद').replace(/\.\w+$/,'')+' ('+langName(R.to)+')',{kinds:['docx','pdf','txt']})
    },
    chg:{tfrom:t=>{R.from=t.value},tto:t=>{R.to=t.value}},
    inp:{tsrc:t=>{R.src=t.value}}
  });
},onLeave(){TTS.stop()}};

/* ================= टूल: क्लाउड / डिवाइस की फ़ाइलें ================= */
T.cloud={tab:'files',scope:'all',q:'',ans:'',srcs:[],sel:null,sum:''};
SCREENS.t_cloud={render(node,p){
  const C=T.cloud;
  const map={connect:'connect',browse:'files',read:'read',ask:'ask',privacy:'privacy'};
  if(p.mode&&map[p.mode])C.tab=map[p.mode];
  let files=[],rn=null;
  const kindIc=f=>f.kind==='table'?'grid':'doc';
  const draw=async()=>{
    files=(await Lib.list()).sort((a,b)=>b.added-a.added);
    const tot=files.reduce((a,f)=>a+(f.chars||0),0);
    const tabs=chipsHtml([['files','फ़ाइलें'],['ask','पूछें'],['read','सार'],['connect','कनेक्ट'],['privacy','प्राइवेसी']],C.tab,'ctab');
    let b='';
    if(C.tab==='files')b=`<button class="btn" data-act="cadd">${ic('upload',18)} फ़ाइलें जोड़ें</button><p class="note">TXT, MD, CSV, PDF (टेक्स्ट वाली), DOCX, XLSX और फ़ोटो (टेक्स्ट पढ़कर) जुड़ सकती हैं।</p>
      ${files.length?card(files.map(f=>`<div class="prow"><button class="it grow" data-act="cview" data-id="${f.id}"><span class="ic">${ic(kindIc(f),20)}</span><span class="tx"><span class="tt">${esc(f.name)}</span><span class="ds">${fmtBytes(f.size||0)} · ${(f.chars||0).toLocaleString('hi-IN')} अक्षर · ${new Date(f.added).toLocaleDateString('hi-IN',{day:'numeric',month:'short'})}</span></span></button><button class="mini" data-act="cdel" data-id="${f.id}" aria-label="हटाएँ">${ic('trash',16)}</button></div>`).join('')):'<p class="note">अभी कोई फ़ाइल नहीं जुड़ी है।</p>'}
      ${files.length?`<p class="note">कुल ${files.length} फ़ाइल · ${tot.toLocaleString('hi-IN')} अक्षर</p>`:''}`;
    if(C.tab==='ask')b=files.length?`${lbl('कहाँ खोजें')}<select class="fld" id="cscope" data-in="cscope" aria-label="फ़ाइल चुनें"><option value="all">सभी फ़ाइलें (${files.length})</option>${files.map(f=>`<option value="${f.id}"${C.scope===f.id?' selected':''}>${esc(f.name)}</option>`).join('')}</select>
      ${field('cq','आपका सवाल',{ta:true,rows:3,ph:'जैसे: इसमें त्रिभुज के कौन-कौन से सूत्र हैं?',val:C.q})}<button class="btn" id="cgo" data-act="cask">${ic('chat',18)} फ़ाइलों से जवाब दो</button>
      <div id="cres"${C.ans?'':' hidden'}><div class="card"><div class="padi md" id="cmd">${md(C.ans)}</div></div>${C.srcs.length?`<details class="faq"><summary>स्रोत अंश (${C.srcs.length})${ic('down',18)}</summary>${C.srcs.map(s=>`<p><b>${esc(s.f)} · भाग ${s.n}</b><br>${esc(s.t.slice(0,420))}…</p>`).join('')}</details>`:''}</div>`
      :`<p class="note">पहले “फ़ाइलें” टैब में फ़ाइलें जोड़ें।</p><button class="btn" data-act="cgoadd">फ़ाइलें जोड़ें</button>`;
    if(C.tab==='read')b=files.length?`${lbl('कौन-सी फ़ाइल')}<select class="fld" id="csel" data-in="csel" aria-label="फ़ाइल चुनें">${files.map(f=>`<option value="${f.id}"${C.sel===f.id?' selected':''}>${esc(f.name)}</option>`).join('')}</select>
      ${chipsHtml([['sum','सार'],['pts','मुख्य बिंदु'],['quiz','10 अभ्यास प्रश्न'],['terms','ज़रूरी शब्द']],C.kind||'sum','ckind')}<button class="btn" id="cgo" data-act="cread">${ic('book',18)} पढ़कर बताओ</button>
      <div class="prog" id="cprog"></div><div id="cres"${C.sum?'':' hidden'}><div class="card"><div class="padi md" id="cmd">${md(C.sum)}</div></div><div class="row2"><button class="btn sm" data-act="ccopy">${ic('copy',16)} कॉपी</button><button class="btn sm ghost" data-act="cexp">${ic('download',16)} सेव</button></div></div>`
      :`<p class="note">पहले फ़ाइलें जोड़ें।</p><button class="btn" data-act="cgoadd">फ़ाइलें जोड़ें</button>`;
    if(C.tab==='connect')b=`<div class="tool-note">${ic('info',16)}<span>Google Drive / OneDrive से सीधा कनेक्शन (लॉगिन) के लिए सर्वर चाहिए, जो इस वेब वर्ज़न में नहीं है।</span></div>
      ${card(`<div class="padi"><div class="tt">फिर भी Drive की फ़ाइल कैसे जोड़ें?</div><p class="note">फ़ोन पर “फ़ाइलें जोड़ें” दबाने से खुलने वाली फ़ाइल-सूची में Google Drive, OneDrive आदि की फ़ाइलें भी दिखती हैं। वहाँ से चुनिए — फ़ाइल इसी ऐप में आ जाएगी और AI उसे पढ़ेगा।</p></div>`)}
      <button class="btn" data-act="cadd">${ic('upload',18)} फ़ाइलें जोड़ें</button>`;
    if(C.tab==='privacy')b=`${card(`<div class="padi"><div class="tt">आपकी फ़ाइलें, आपके नियंत्रण में</div><p class="note">• फ़ाइलें इसी ब्राउज़र (इस डिवाइस) में रखी जाती हैं।<br>• AI को सिर्फ़ वही अंश भेजे जाते हैं जो आपके सवाल से जुड़े हों (या सार बनाते समय फ़ाइल का हिस्सा)।<br>• कोई फ़ाइल अपने-आप कहीं अपलोड नहीं होती।<br>• आप कभी भी फ़ाइल या सब कुछ हटा सकते हैं।</p></div>`)}
      <button class="btn dng ghost" data-act="cclear"${files.length?'':' disabled'}>${ic('trash',18)} सारी फ़ाइलें हटाएँ</button>`;
    toolBody(node,'क्लाउड फ़ाइलें',tabs+b);
    const g=$('#cgo',node);rn=g?runner(g,g.innerHTML):null;
  };
  const addFiles=async()=>{
    const fs=await pickFiles({multiple:true,accept:'.txt,.md,.csv,.tsv,.json,.html,.xml,.pdf,.docx,.xlsx,.xls,.png,.jpg,.jpeg,.webp'});
    if(!fs.length)return;let n=0;
    for(const f of fs){
      toast('“'+f.name+'” पढ़ रहा हूँ…',2500);
      try{
        const r=await readFileAny(f);let text=r.text||'';
        if(r.kind==='image'){
          if(!(await imgCaps())){toast('फ़ोटो से टेक्स्ट पढ़ने की सुविधा इस व्यू में नहीं है');continue}
          const b=await shrinkImage(f,1800);
          text=(await ai({prompt:'इस फ़ोटो का सारा टेक्स्ट ज्यों का त्यों लिखो। टेबल हो तो मार्कडाउन टेबल। कुछ गढ़ो मत; पढ़ने लायक न हो तो "कोई टेक्स्ट नहीं" लिखो।',images:[b],tier:'default',kind:'tool'})).text;
        }
        if(text.length>6000000)text=text.slice(0,6000000);
        if(text.trim().length<5){toast('“'+f.name+'” में पढ़ने लायक टेक्स्ट नहीं मिला');continue}
        await Lib.add({id:uid(),name:f.name,kind:r.kind==='table'?'table':'text',size:f.size,chars:text.length,text,added:Date.now()});n++;
      }catch(e){toast((e&&e.code&&e.message&&e.code!=='cancelled')?e.message:errMsg(e)||'“'+f.name+'” जुड़ नहीं सकी',4500)}
    }
    if(n)toast(n+' फ़ाइल जुड़ी');C.tab='files';draw();
  };
  draw();
  const kindP={sum:'इस फ़ाइल का संक्षिप्त सार लिखो (10-15 लाइन): विषय, मुख्य बातें, निष्कर्ष।',pts:'इस फ़ाइल के सबसे ज़रूरी मुख्य बिंदु बुलेट में लिखो, हर बिंदु के साथ एक पंक्ति का स्पष्टीकरण।',quiz:'इस फ़ाइल की सामग्री के आधार पर 10 अभ्यास प्रश्न बनाओ (उत्तर अंत में अलग से)। सिर्फ़ फ़ाइल में दी जानकारी इस्तेमाल करो।',terms:'इस फ़ाइल के ज़रूरी शब्दों/परिभाषाओं/सूत्रों की सूची बनाओ: शब्द — अर्थ। सिर्फ़ फ़ाइल से।'};
  wire(node,{
    act:{
      ctab:t=>{C.tab=t.dataset.v;draw()},
      cadd:addFiles,cgoadd:()=>{C.tab='files';draw()},
      cdel:t=>{confirmSheet({title:'फ़ाइल हटाएँ?',msg:'यह फ़ाइल इस डिवाइस से हट जाएगी।',ok:'हटाएँ',danger:true,onOk:async()=>{await Lib.remove(t.dataset.id);draw()}})},
      cview:t=>{const f=files.find(x=>x.id===t.dataset.id);if(f)infoSheet({title:f.name,html:`<p class="note">${(f.chars||0).toLocaleString('hi-IN')} अक्षर · शुरुआती हिस्सा:</p><pre class="prevtxt">${esc(f.text.slice(0,1800))}</pre>`,actions:[{t:'इस पर सवाल पूछें',f:()=>{C.tab='ask';C.scope=f.id;draw()}},{t:'सार बनाएँ',ghost:true,f:()=>{C.tab='read';C.sel=f.id;draw()}}]})},
      ckind:t=>{C.kind=t.dataset.v;chipSet(t.parentNode,t)},
      cclear:()=>confirmSheet({title:'सारी फ़ाइलें हटाएँ?',msg:'जोड़ी गई सारी फ़ाइलें इस डिवाइस से हट जाएँगी।',ok:'सब हटाएँ',danger:true,onOk:async()=>{await Lib.clear();draw();toast('फ़ाइलें हट गईं')}}),
      cask:async()=>{
        C.q=$('#cq',node).value.trim();C.scope=$('#cscope',node).value;
        if(!C.q){toast('पहले सवाल लिखें');return}
        const pool=C.scope==='all'?files:files.filter(f=>f.id===C.scope);
        $('#cres',node).hidden=false;const m=$('#cmd',node);m.innerHTML=THINK;
        const r=await rn.run(async sig=>{
          let kw='';
          try{kw=(await ai({prompt:'इस सवाल के लिए फ़ाइलों में खोजने के 8-12 मुख्य शब्द दो — हिंदी और English दोनों में (अनुवाद सहित), सिर्फ़ स्पेस से अलग किए शब्द, कोई और टेक्स्ट नहीं।\nसवाल: '+C.q,tier:'quick',signal:sig,kind:'tool',track:false})).text}catch(e){if(e&&e.code==='cancelled')throw e}
          let hits=retrieve(pool,C.q+' '+kw,8);
          if(!hits.length){C.srcs=[];return {text:'**फ़ाइलों में इस सवाल से जुड़ी जानकारी नहीं मिली।** सवाल को दूसरे शब्दों में पूछें, या सही फ़ाइल जोड़ें।'}}
          C.srcs=hits;
          const ctx=hits.map((h,k)=>`[${k+1}] (${h.f} · भाग ${h.n})\n${h.t}`).join('\n\n');
          return await ai({prompt:`नीचे फ़ाइलों से निकाले गए अंश हैं। सिर्फ़ इन अंशों के आधार पर सवाल का जवाब दो।\nनियम: जवाब में जहाँ जानकारी ली हो वहाँ [1], [2] जैसे स्रोत-नंबर लिखो। अंशों में जवाब न हो तो साफ़ लिखो “फ़ाइल में यह जानकारी नहीं मिली” — अपनी तरफ़ से मत गढ़ो। जरूरत हो तो अलग से लिखो “(फ़ाइल से बाहर, मेरे सामान्य ज्ञान से)”।\n\nअंश:\n${ctx}\n\nसवाल: ${C.q}`,system:sysPrompt(),tier:'default',signal:sig,kind:'tool',onText:t=>{m.innerHTML=md(t)}});
        });
        if(r){C.ans=r.text;draw()}else if(!C.ans)$('#cres',node).hidden=true;
      },
      cread:async()=>{
        const f=files.find(x=>x.id===$('#csel',node).value);if(!f)return;C.sel=f.id;
        const kind=C.kind||'sum';$('#cres',node).hidden=false;const m=$('#cmd',node);m.innerHTML=THINK;const pg=$('#cprog',node);
        const r=await rn.run(async sig=>{
          let text=f.text;
          if(text.length>14000){
            const parts=chunkText(text,12000,0);let use=parts;if(parts.length>30){const st=parts.length/30;use=Array.from({length:30},(_,i)=>parts[Math.floor(i*st)])}
            const notes=new Array(use.length);let nx=0;
            const upd=()=>{pg.innerHTML=`<div class="ps run"><span class="pdot"></span><span>${notes.filter(Boolean).length} / ${use.length} हिस्से पढ़े</span></div>`};upd();
            const w=async()=>{while(nx<use.length){const i=nx++;notes[i]=(await ai({prompt:'इस हिस्से के मुख्य तथ्य/बातें बुलेट में लिखो (सिर्फ़ टेक्स्ट में जो है):\n\n'+use[i],tier:'quick',signal:sig,kind:'tool',track:false})).text;upd()}};
            await Promise.all([w(),w(),w()]);pg.innerHTML='';text=notes.map((n,i)=>`[हिस्सा ${i+1}]\n${n}`).join('\n\n');
            if(parts.length>30)text='(फ़ाइल बहुत बड़ी है, इसलिए बराबर दूरी से 30 हिस्से पढ़े गए)\n'+text;
          }
          return await ai({prompt:kindP[kind]+'\n\nफ़ाइल: '+f.name+'\n\n'+text,system:sysPrompt(),tier:'default',signal:sig,kind:'tool',onText:t=>{m.innerHTML=md(t)}});
        });
        if(r){C.sum=r.text;m.innerHTML=md(r.text)}else if(!C.sum)$('#cres',node).hidden=true;
      },
      ccopy:()=>copyText(C.sum),cexp:()=>exportSheet(C.sum,'फ़ाइल सार')
    },
    chg:{cscope:t=>{C.scope=t.value},csel:t=>{C.sel=t.value}},
    inp:{cq:t=>{C.q=t.value}}
  });
}};

/* ================= SVG / इमेज सहायक ================= */
function svgClean(raw,W,H){
  const m=String(raw||'').match(/<svg[\s\S]*<\/svg>/i);if(!m)return null;
  let doc;try{doc=new DOMParser().parseFromString(m[0],'image/svg+xml')}catch(e){return null}
  const root=doc.documentElement;
  if(!root||root.nodeName.toLowerCase()!=='svg'||doc.querySelector('parsererror'))return null;
  doc.querySelectorAll('script,foreignObject,iframe,object,embed,audio,video,image,a').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(n=>{Array.from(n.attributes).forEach(a=>{
    const nm=a.name.toLowerCase(),v=a.value;
    if(nm.startsWith('on')||((nm==='href'||nm==='xlink:href')&&!v.trim().startsWith('#'))||/javascript:|data:text\/html/i.test(v)||/url\(\s*['"]?\s*(https?:|data:|\/\/)/i.test(v))n.removeAttribute(a.name);
  })});
  doc.querySelectorAll('style').forEach(s=>{if(/@import|url\(\s*['"]?(https?:|data:|\/\/)/i.test(s.textContent))s.remove()});
  if(!root.getAttribute('viewBox'))root.setAttribute('viewBox',`0 0 ${W||1000} ${H||1000}`);
  root.setAttribute('xmlns','http://www.w3.org/2000/svg');root.removeAttribute('width');root.removeAttribute('height');
  return new XMLSerializer().serializeToString(root);
}
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src});
async function rasterSvg(svg,W,H){
  const s=svg.replace('<svg','<svg width="'+W+'" height="'+H+'"');
  const im=await loadImg(svgURL(s));
  const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);return c;
}
const canvasBlob=(c,type='image/png',q=.92)=>new Promise(r=>c.toBlob(b=>r(b),type,q));
async function svgFromAI(prompt,W,H,{sig,tier='default',extra='',onText}={}){
  const r=await ai({prompt:`नीचे के वर्णन का एक सुंदर SVG चित्र बनाओ।\nवर्णन: ${prompt}\n${extra}\nनियम: सिर्फ़ एक पूरा <svg>…</svg> कोड दो (कोई मार्कडाउन या समझावन नहीं)। viewBox="0 0 ${W} ${H}" रखो। कोई बाहरी इमेज, फ़ॉन्ट, लिंक या स्क्रिप्ट नहीं। रंग-ढाल (gradient), परतें और छाया इस्तेमाल करके समृद्ध और संतुलित रचना बनाओ। टेक्स्ट ज़रूरी हो तो font-family="Hind, sans-serif" रखो।`,system:'तुम कुशल वेक्टर इलस्ट्रेटर हो। सिर्फ़ वैध SVG लौटाते हो।',tier,signal:sig,kind:'tool',onText});
  const svg=svgClean(r.text,W,H);
  if(!svg)throw {message:'AI से सही SVG नहीं मिला, फिर कोशिश करें'};
  return svg;
}

function cloneCanvas(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;n.getContext('2d').drawImage(c,0,0);return n}
function fitCanvas(src,max=PH_MAX){
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));

}

function applyAdj(c,w,h,a){
  if(a.bl>0){
    const k=1/(1+a.bl*.9),t=document.createElement('canvas');t.width=Math.max(1,Math.round(w*k));t.height=Math.max(1,Math.round(h*k));
    const tc=t.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(c.canvas,0,0,t.width,t.height);
    c.clearRect(0,0,w,h);c.imageSmoothingEnabled=true;c.drawImage(t,0,0,w,h);
  }
  if(a.br||a.co||a.sa||a.wa||a.gray||a.sepia){
    const id=c.getImageData(0,0,w,h),d=id.data,C=a.co*2.55,f=(259*(C+255))/(255*(259-C)),s=1+a.sa/100,bo=a.br*2.55,wr=a.wa*.6,wb=-a.wa*.6,wg=a.wa*.1;
    for(let i=0;i<d.length;i+=4){
      let r=d[i]+bo+wr,g=d[i+1]+bo+wg,b=d[i+2]+bo+wb;
      if(a.co){r=f*(r-128)+128;g=f*(g-128)+128;b=f*(b-128)+128}
      if(a.sa){const l=.299*r+.587*g+.114*b;r=l+(r-l)*s;g=l+(g-l)*s;b=l+(b-l)*s}
      if(a.gray){const l=.299*r+.587*g+.114*b;r=g=b=l}
      if(a.sepia){const nr=.393*r+.769*g+.189*b,ng=.349*r+.686*g+.168*b,nb=.272*r+.534*g+.131*b;r=nr;g=ng;b=nb}
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
    c.putImageData(id,0,0);
  }
  if(a.vg>0){const gr=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+(a.vg/100*.85)+')');c.fillStyle=gr;c.fillRect(0,0,w,h)}
}
function drawTexts(c,w,h,texts,sel,boxes){

    const lines=String(t.t).split('\n'),lh=fs*1.25,tw=Math.max(...lines.map(l=>c.measureText(l).width)),th=lh*lines.length;
    const cx=t.x*w,cy=t.y*h;
    if(t.bg){c.fillStyle='rgba(0,0,0,.5)';const p=fs*.3,x0=cx-tw/2-p,y0=cy-th/2-p/2,ww=tw+p*2,hh=th+p;c.beginPath();if(c.roundRect)c.roundRect(x0,y0,ww,hh,fs*.25);else c.rect(x0,y0,ww,hh);c.fill()}
    c.fillStyle=t.color;c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=t.bg?0:fs*.12;
    lines.forEach((l,k)=>c.fillText(l,cx,cy-th/2+lh*(k+.5)));

    if(boxes&&sel===i){c.strokeStyle='#5EE0C8';c.lineWidth=2;c.setLineDash([6,4]);c.strokeRect(cx-tw/2-6,cy-th/2-4,tw+12,th+8);c.setLineDash([])}

}
function renderPhoto(cv,maxDim,forExport){

function convolve(c,w,h,kern,div,bias=0){
  const id=c.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    for(let ch=0;ch<3;ch++){let a=0,n=0;for(let ky=-1;ky<=1;ky++)for(let kx=-1;kx<=1;kx++){const yy=Math.min(h-1,Math.max(0,y+ky)),xx=Math.min(w-1,Math.max(0,x+kx));a+=s[(yy*w+xx)*4+ch]*kern[n++]}o[i+ch]=a/div+bias}
    o[i+3]=s[i+3];
  }
  id.data.set(o);c.putImageData(id,0,0);
}
function autoLevels(c,w,h,cast=true){
  const id=c.getImageData(0,0,w,h),d=id.data,n=w*h;let sr=0,sg=0,sb=0;
  const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)];
  for(let i=0;i<d.length;i+=4){sr+=d[i];sg+=d[i+1];sb+=d[i+2];hist[0][d[i]]++;hist[1][d[i+1]]++;hist[2][d[i+2]]++}
  const avg=(sr+sg+sb)/(3*n),gain=cast?[avg/(sr/n||1),avg/(sg/n||1),avg/(sb/n||1)].map(g=>Math.min(1.35,Math.max(.75,g))):[1,1,1];
  const lo=[0,0,0],hi=[255,255,255];
  for(let ch=0;ch<3;ch++){let a=0;for(let v=0;v<256;v++){a+=hist[ch][v];if(a>n*.01){lo[ch]=v;break}}a=0;for(let v=255;v>=0;v--){a+=hist[ch][v];if(a>n*.01){hi[ch]=v;break}}if(hi[ch]-lo[ch]<30){lo[ch]=0;hi[ch]=255}}
  for(let i=0;i<d.length;i+=4)for(let ch=0;ch<3;ch++)d[i+ch]=((d[i+ch]*gain[ch]-lo[ch])/(hi[ch]-lo[ch]))*255;
  c.putImageData(id,0,0);
}
/* हटाना: आसपास के रंगों से भरना (प्रसार) */
function inpaintCanvas(base,mk,w,x0,y0,bw,bh){
  const s=Math.max(1,Math.ceil(Math.max(bw,bh)/140)),sw=Math.max(3,Math.ceil(bw/s)),sh=Math.max(3,Math.ceil(bh/s));
  const t=document.createElement('canvas');t.width=sw;t.height=sh;const tc=t.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(base,x0,y0,bw,bh,0,0,sw,sh);
  const px=tc.getImageData(0,0,sw,sh).data,M=new Uint8Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){let hit=0;for(let yy=0;yy<s&&!hit;yy++)for(let xx=0;xx<s;xx++){const ox=x0+Math.min(bw-1,x*s+xx),oy=y0+Math.min(bh-1,y*s+yy);if(mk[(oy*w+ox)*4+3]>40){hit=1;break}}M[y*sw+x]=hit}
  const D=M.slice();for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(M[y*sw+x]){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<sh&&xx>=0&&xx<sw)D[yy*sw+xx]=1}}
  const ch=[new Float32Array(sw*sh),new Float32Array(sw*sh),new Float32Array(sw*sh)];let kn=[0,0,0],cnt=0;
  for(let i=0;i<sw*sh;i++)if(!D[i]){for(let c3=0;c3<3;c3++){ch[c3][i]=px[i*4+c3];kn[c3]+=px[i*4+c3]}cnt++}
  const mean=kn.map(v=>v/(cnt||1));
  for(let i=0;i<sw*sh;i++)if(D[i])for(let c3=0;c3<3;c3++)ch[c3][i]=mean[c3];
  const it=Math.min(400,60+Math.max(sw,sh)*3);
  for(let n=0;n<it;n++){
    for(let c3=0;c3<3;c3++){const a=ch[c3];
      for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=y*sw+x;if(!D[i])continue;
        const l=x>0?a[i-1]:a[i],r=x<sw-1?a[i+1]:a[i],u=y>0?a[i-sw]:a[i],d=y<sh-1?a[i+sw]:a[i];a[i]=(l+r+u+d)/4}}
  }
  const o=document.createElement('canvas');o.width=sw;o.height=sh;const oc=o.getContext('2d'),oi=oc.createImageData(sw,sh);
  for(let i=0;i<sw*sh;i++){oi.data[i*4]=ch[0][i];oi.data[i*4+1]=ch[1][i];oi.data[i*4+2]=ch[2][i];oi.data[i*4+3]=255}
  oc.putImageData(oi,0,0);
  const out=document.createElement('canvas');out.width=bw;out.height=bh;const x2=out.getContext('2d');x2.imageSmoothingEnabled=true;x2.imageSmoothingQuality='high';x2.drawImage(o,0,0,bw,bh);
  /* हल्का दाना (आसपास जैसा) */
  let diff=0,dn=0;const orig=base.getContext('2d').getImageData(x0,y0,bw,bh).data;
  for(let y=0;y<bh;y+=3)for(let x=0;x<bw-1;x+=3){const i=(y*bw+x)*4;if(mk[((y0+y)*w+x0+x)*4+3]<5){diff+=Math.abs(orig[i+1]-orig[i+5]);dn++}}
  const sig=Math.min(10,(dn?diff/dn:2)*.9);
  if(sig>.8){const oi2=x2.getImageData(0,0,bw,bh),dd=oi2.data;for(let i=0;i<dd.length;i+=4){const n=(Math.random()+Math.random()-1)*sig*1.6;dd[i]+=n;dd[i+1]+=n;dd[i+2]+=n}x2.putImageData(oi2,0,0)}
  return out;
}
function bgMask(base,tol,full){
  const k=Math.min(1,600/Math.max(base.width,base.height)),sw=Math.max(2,Math.round(base.width*k)),sh=Math.max(2,Math.round(base.height*k));
  const t=document.createElement('canvas');t.width=sw;t.height=sh;const tc=t.getContext('2d',{willReadFrequently:true});tc.drawImage(base,0,0,sw,sh);
  const d=tc.getImageData(0,0,sw,sh).data,at=(x,y)=>(y*sw+x)*4;
  const bor=[];for(let x=0;x<sw;x++){bor.push(at(x,0),at(x,sh-1))}for(let y=0;y<sh;y++){bor.push(at(0,y),at(sw-1,y))}
  const med=ch=>{const a=bor.map(i=>d[i+ch]).sort((p,q)=>p-q);return a[a.length>>1]};
  const ref=[med(0),med(1),med(2)];
  const dist=(i,r)=>Math.hypot(d[i]-r[0],d[i+1]-r[1],d[i+2]-r[2]);
  const M=new Uint8Array(sw*sh),q=[];
  bor.forEach(i=>{const p=i/4;if(!M[p]&&dist(i,ref)<=tol){M[p]=1;q.push(p)}});
  while(q.length){
    const p=q.pop(),x=p%sw,y=(p/sw)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=sw||yy>=sh)continue;
      const n=yy*sw+xx;if(M[n])continue;const i=n*4;
      if(dist(i,ref)<=tol||Math.hypot(d[i]-d[p*4],d[i+1]-d[p*4+1],d[i+2]-d[p*4+2])<tol*.22&&dist(i,ref)<tol*1.6){M[n]=1;q.push(n)}
    }
  }
  const m=document.createElement('canvas');m.width=sw;m.height=sh;const mc=m.getContext('2d'),mi=mc.createImageData(sw,sh);
  let cnt=0;for(let i=0;i<sw*sh;i++){const v=M[i];cnt+=v;mi.data[i*4]=255;mi.data[i*4+1]=255;mi.data[i*4+2]=255;mi.data[i*4+3]=v?255:0}
  mc.putImageData(mi,0,0);
  const W=full?base.width:sw,H=full?base.height:sh;
  const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d');oc.imageSmoothingQuality='high';
  /* किनारा नरम */
  const sm=document.createElement('canvas');sm.width=Math.max(2,sw>>1);sm.height=Math.max(2,sh>>1);sm.getContext('2d').drawImage(m,0,0,sm.width,sm.height);
  oc.drawImage(sm,0,0,W,H);
  return {canvas:o,ratio:cnt/(sw*sh)};
}

    });
    const end=()=>{drag=null};wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
  }

T.vid={prompt:'',dur:30,ratio:'9:16',style:'edu',scenes:[],t:0,playing:false,voice:false,rec:false};
const VSIZE={'9:16':[540,960],'16:9':[960,540],'1:1':[720,720]};
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function vidTotal(sc){return sc.reduce((a,s)=>a+s.dur,0)}
function wrapLines(c,text,maxW){
  const out=[];String(text||'').split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(c.measureText(t).width<=maxW||!line)line=t;else{out.push(line);line=w}});out.push(line)});return out;
}
function drawVid(cv,sc,t){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  if(!sc.length){c.fillStyle='#0B1020';c.fillRect(0,0,W,H);return}
  let acc=0,i=0;for(;i<sc.length-1&&t>=acc+sc[i].dur;i++)acc+=sc[i].dur;
  const s=sc[i],u=Math.min(1,Math.max(0,(t-acc)/s.dur)),el=t-acc,left=s.dur-el;
  if(s.imgC){const im=s.imgC,k=Math.max(W/im.width,H/im.height)*(1+.1*u),w=im.width*k,h=im.height*k;c.drawImage(im,(W-w)/2-(u*W*.03),(H-h)/2,w,h);c.fillStyle='rgba(0,0,0,.38)';c.fillRect(0,0,W,H)}
  else{const g=c.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,s.c1||'#1B2547');g.addColorStop(1,s.c2||'#0B1020');c.fillStyle=g;c.fillRect(0,0,W,H);
    for(let k=0;k<5;k++){c.fillStyle='rgba(255,255,255,'+(.04+k*.012)+')';c.beginPath();c.arc(W*(.15+k*.2)+Math.sin(t*.6+k)*W*.05,H*(.2+((k*37)%60)/100)+Math.cos(t*.5+k)*H*.03,Math.min(W,H)*(.12+k*.04),0,7);c.fill()}}
  const fade=Math.min(1,el/.35,left/.35);c.globalAlpha=Math.max(0,fade);
  const sz=Math.min(W,H);
  if(s.emoji){const pop=easeOutBack(Math.min(1,el/.6));c.font=`${Math.round(sz*.26*Math.max(.01,pop))}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(s.emoji,W/2,H*.3)}
  c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=sz*.02;
  let fs=Math.round(sz*.075);c.font=`700 ${fs}px Hind,"Noto Sans Devanagari",system-ui,sans-serif`;
  let y=H*(s.emoji?.5:.38);wrapLines(c,s.title,W*.84).forEach(l=>{c.fillText(l,W/2,y);y+=fs*1.25});
  fs=Math.round(sz*.045);c.font=`400 ${fs}px Hind,"Noto Sans Devanagari",system-ui,sans-serif`;c.fillStyle='rgba(255,255,255,.93)';y+=fs*.4;
  wrapLines(c,s.text,W*.82).forEach(l=>{c.fillText(l,W/2,y);y+=fs*1.4});
  c.shadowBlur=0;c.globalAlpha=1;
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(W*.08,H-sz*.05,W*.84,4);c.fillStyle='#fff';c.fillRect(W*.08,H-sz*.05,W*.84*Math.min(1,t/vidTotal(sc)),4);
  c.font=`400 ${Math.round(sz*.03)}px Hind,sans-serif`;c.fillStyle='rgba(255,255,255,.7)';c.textAlign='right';c.fillText('Apna AI',W*.92,H-sz*.07);
}

        const n=Math.max(3,Math.min(10,Math.round(V.dur/6)));
        const st={edu:'सिखाने वाला, सरल और साफ़',moti:'प्रेरणादायक और ऊर्जावान',story:'छोटी कहानी की तरह',ad:'आकर्षक विज्ञापन की तरह'}[V.style];
        const r=await rn.run(sig=>aiJSON({prompt:`विषय: ${V.prompt}\nएक ${V.dur} सेकंड के छोटे वीडियो की पटकथा बनाओ, ठीक ${n} दृश्य, अंदाज़: ${st}. भाषा: ${S.lang==='en'?'English':'हिंदी'}.\nसिर्फ़ JSON: {"scenes":[{"title":"छोटा शीर्षक (4-6 शब्द)","text":"स्क्रीन पर 1-2 छोटी पंक्तियाँ","narr":"बोलने के लिए 1-2 सरल वाक्य","emoji":"एक इमोजी","c1":"#गहरा रंग hex","c2":"#दूसरा रंग hex"}]}\nनियम: रंग गहरे/संतृप्त हों ताकि सफ़ेद टेक्स्ट साफ़ पढ़ा जाए; तथ्य सही हों, गढ़ो मत; पहला दृश्य आकर्षक शुरुआत और आख़िरी दृश्य निष्कर्ष/अपील हो।`,system:sysPrompt(),tier:'default',signal:sig,kind:'tool'}));
        if(r&&Array.isArray(r.scenes)&&r.scenes.length){
          const base=V.dur/r.scenes.length;
          V.scenes=r.scenes.slice(0,12).map(s=>{const o={title:String(s.title||'').slice(0,60),text:String(s.text||'').slice(0,140),narr:String(s.narr||s.text||'').slice(0,240),emoji:String(s.emoji||'').slice(0,4),c1:/^#[0-9a-f]{6}$/i.test(s.c1)?s.c1:'#1B2547',c2:/^#[0-9a-f]{6}$/i.test(s.c2)?s.c2:'#0B1020',base};o.dur=durFor(o,base);return o});
          V.t=0;await ensureFonts();draw();toast('वीडियो तैयार — चलाकर देखें');
        }else if(r)toast('दृश्य सही रूप में नहीं बने, फिर कोशिश करें');
      },
      vplay:()=>play(false),vvoice:()=>play(true),
      vexp:exportVid,
      vadd:()=>{readEdits();V.scenes.push({title:'नया दृश्य',text:'यहाँ टेक्स्ट लिखें',narr:'यहाँ बोलने वाला टेक्स्ट लिखें',emoji:'✨',c1:'#243B6B',c2:'#0B1020',base:5,dur:6});stop();draw()},
      vdel:t=>{readEdits();if(V.scenes.length<2){toast('कम से कम एक दृश्य रखें');return}V.scenes.splice(+t.dataset.i,1);V.t=0;stop();draw()},
      vimg:async t=>{readEdits();const f=(await pickFiles({accept:'image/*'}))[0];if(!f)return;try{V.scenes[+t.dataset.i].imgC=await mkImgC(f);draw()}catch(e){toast('फ़ोटो खुल नहीं सकी')}},
      vrmimg:t=>{readEdits();delete V.scenes[+t.dataset.i].imgC;draw()}
    }
  });
  node.addEventListener('input',e=>{if(e.target.id==='vseek'){V.seeking=true;V.t=+e.target.value;if(V.playing)t0=performance.now()-V.t*1000;frame()}});
  node.addEventListener('change',e=>{if(e.target.id==='vseek')V.seeking=false});
},onLeave(){TTS.stop();T.vid.playing=false}};

/* ================= स्टैंडअलोन: पहली बार का AI सेटअप (Claude के बाहर) ================= */
function openSetup(){
  const cfg=window.APNA_CONFIG||{};
  const sh=openSheet({title:'AI सेटअप',html:`<p class="note">अपना Cloudflare Worker जोड़ें। असली Gemini/OpenAI key सिर्फ़ Worker में रहती है; यहाँ सिर्फ़ ऐप का पासवर्ड (APP_TOKEN) डलता है।</p>
    ${field('su','Worker का पता',{ph:'https://नाम.workers.dev',val:cfg.proxyBase||''})}
    ${field('st','ऐप पासवर्ड (APP_TOKEN)',{type:'password',ph:'Worker में रखा पासवर्ड'})}
    <div class="sp12"></div><div class="btn-row"><button class="btn ghost" data-close>बाद में</button><button class="btn" id="su-ok">जोड़ें</button></div>`});
  $('#su-ok',sh.body).onclick=()=>{
    let u=$('#su',sh.body).value.trim().replace(/\/+$/,'').replace(/\/(gemini|openai)\/v1$/,'');
    const t=$('#st',sh.body).value.trim();
    if(!/^https:\/\/[^\s/]+$/.test(u)||t.length<8){toast('सही https पता और पासवर्ड भरें');return}
    const g={id:'c'+uid(),name:'Gemini',url:u+'/gemini/v1',model:cfg.geminiModel||'gemini-2.5-flash',key:t,imgModel:''};
    const o={id:'c'+uid(),name:'OpenAI',url:u+'/openai/v1',model:cfg.openaiModel||'gpt-4o-mini',key:t,imgModel:''};
    S.customs.push(g,o);S.provider=g.id;save();loadCustoms();sh.close();toast('जुड़ गया: Gemini और OpenAI (Settings → AI Model में बदल सकते हैं)',4200);
  };
}

/* ================= शुरुआत ================= */
/* Android का बैक बटन: पहले खुली शीट बंद, फिर पिछली स्क्रीन; कुछ न बचे तो false */
window.__appBack=function(){
  if(sheetStack.length){sheetStack[sheetStack.length-1].close();return true}
  if(NAV.length>1){back();return true}
  return false;
};
applyTheme();
$('#app').innerHTML='<div id="screens"></div>';
(function init(){
  const last=S.start==='last'?listChats()[0]:null;
  cur=last||newChatObj();
  go('home');
  if(S.lock.on&&S.lock.hash)showLock();
  else if(!window.claude&&!S.customs.length)setTimeout(openSetup,500);
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)hiddenAt=Date.now();
    else if(S.lock.on&&S.lock.hash&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();
  });
  try{speechSynthesis.getVoices()}catch(e){}
  window.addEventListener('unhandledrejection',e=>{console.error('unhandled',e.reason)});
})();
})();
